# Konfiguracja dla WAN 2.2 14B Image-to-Video workflow (UNIFIED)
workflow_name: "WAN 2.2 14B - Image to Video (Unified)"
workflow_file: "workflow-api-fv9kYUtmjLzC5I8tRR49y.json"
description: "Generates video transitions between two images using WAN model (unified local+cloud)"

# ============================================================
# MAPOWANIE PARAMETROW - uzywane przez workflow_base.py
# ============================================================

parameters:
  # Obrazy wejsciowe
  start_image:
    node_id: 68  # ← ZMIENIONE (było: 80)
    param_name: "image"
    type: "image"
  
  end_image:
    node_id: 62  # ← ZMIENIONE (było: 89)
    param_name: "image"
    type: "image"
  
  # Prompty
  positive_prompt:
    node_id: 6  # ← ZMIENIONE (było: 90)
    param_name: "text"
    type: "string"
  
  negative_prompt:
    node_id: 7  # ← ZMIENIONE (było: 78)
    param_name: "text"
    type: "string"
  
  # Parametry wideo
  video_config:
    node_id: 67  # ← ZMIENIONE (było: 81)
    params:
      width: width
      height: height
      length: length
  
  # FPS - VHS_VideoCombine node
  fps_config:
    node_id: 71  # ← ZMIENIONE (było: 86)
    param_name: "frame_rate"  # ← ZMIENIONE (było: fps)
  
  # Sampler HIGH (pierwszy przebieg, 0-10 steps)
  sampler_high:
    node_id: 57  # ← ZMIENIONE (było: 84)
    params:
      noise_seed: seed  # ← Node 57 uses "noise_seed"
      steps: steps
      cfg: cfg
      start_at_step: start_at_step
      end_at_step: end_at_step
      return_with_leftover_noise: return_with_leftover_noise
  
  # Sampler LOW (drugi przebieg, 10-koniec)
  sampler_low:
    node_id: 58  # ← ZMIENIONE (było: 87)
    params:
      steps: steps
      cfg: cfg
      start_at_step: start_at_step
      end_at_step: end_at_step
      return_with_leftover_noise: return_with_leftover_noise

# ============================================================
# DOMYSLNE WARTOSCI
# ============================================================

defaults:
  width: 464  # Adjusted for unified workflow
  height: 688
  fps: 16     # Unified workflow default
  steps: 20
  cfg: 4.0
  
  # Prompty
  positive_prompt: "Smooth cinematic transition, high quality, detailed, natural motion"
  negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"

# ============================================================
# OGRANICZENIA/WALIDACJA
# ============================================================

constraints:
  width:
    min: 256
    max: 1024
    divisible_by: 8
  height:
    min: 256
    max: 1024
    divisible_by: 8
  fps:
    allowed: [12, 16, 24, 30]
  steps:
    min: 10
    max: 50
  cfg:
    min: 1.0
    max: 10.0