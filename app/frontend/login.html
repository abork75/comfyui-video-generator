<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Video Generator — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">

    <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md border border-gray-700">

        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-5xl mb-3">🎬</div>
            <h1 class="text-2xl font-bold text-white">ComfyUI Video Generator</h1>
            <p class="text-gray-400 mt-2 text-sm">Zaloguj się aby kontynuować</p>
        </div>

        <!-- Error message -->
        <div id="error-msg"
             class="hidden bg-red-900/50 border border-red-500 text-red-300 px-4 py-3 rounded-lg mb-5 text-sm">
            ❌ Nieprawidłowy login lub hasło
        </div>

        <!-- Login form -->
        <form method="POST" action="/login" class="space-y-4">

            <div>
                <label class="block text-gray-300 text-sm font-medium mb-1.5">Login</label>
                <input
                    type="text"
                    name="username"
                    required
                    autofocus
                    autocomplete="username"
                    class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg px-4 py-3
                           focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500
                           transition placeholder-gray-500"
                    placeholder="użytkownik"
                >
            </div>

            <div>
                <label class="block text-gray-300 text-sm font-medium mb-1.5">Hasło</label>
                <input
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg px-4 py-3
                           focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500
                           transition placeholder-gray-500"
                    placeholder="••••••••"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold
                       py-3 rounded-lg transition mt-2">
                Zaloguj się →
            </button>

        </form>

    </div>

    <script>
        if (new URLSearchParams(window.location.search).get('error')) {
            document.getElementById('error-msg').classList.remove('hidden');
        }
    </script>

</body>
</html>
