                                         class="w-full h-full object-cover"
                                         onerror="this.style.display='none'">
                                    <!-- Seq number -->
                                    <span class="absolute top-0.5 left-0.5 bg-black/75 text-white rounded px-1 leading-none"
                                          style="font-size:9px" x-text="i+1"></span>
                                    <!-- Type badge -->
                                    <span class="absolute top-0.5 right-0.5 bg-black/75 rounded px-1 leading-none"
                                          style="font-size:9px"
                                          :class="clip.type==='external' ? 'text-blue-400' : clip.subtype==='chain' ? 'text-purple-400' : 'text-gray-400'"
                                          x-text="clip.type==='external' ? '📂' : clip.subtype==='chain' ? '⛓' : '🔀'">
                                    </span>
                                    <!-- Playing pulse -->
                                    <template x-if="i === postCurrentIndex">
                                        <div class="absolute inset-0 border-2 border-green-400 rounded pointer-events-none"
                                             :class="postIsPlaying ? 'opacity-100' : 'opacity-60'"></div>
                                    </template>
                                </div>
                                <!-- Status bar -->
                                <div class="h-0.5"
                                     :class="i===postCurrentIndex ? 'bg-green-400' : clip.status==='ok' ? 'bg-green-800' : 'bg-red-800'">
                                </div>
                                <!-- Name -->
                                <div class="bg-gray-900 px-1 py-0.5 text-center text-gray-600 truncate"
                                     style="font-size:9px" x-text="clip.name"></div>
                            </div>
                        </template>
                    </div>

                </div>
            </template>

        </div>

        <!-- INPUT NEEDED BANNER -->
        <div x-show="awaitingInput" x-cloak
             class="flex-shrink-0 border-t-2 border-yellow-500 bg-yellow-950 px-5 py-3 flex items-center gap-4">
            <span class="text-yellow-400 text-lg flex-shrink-0">❓</span>
            <div class="flex-1 min-w-0">
                <p class="text-xs text-yellow-300 font-semibold mb-0.5">Skrypt czeka na potwierdzenie:</p>
                <p class="text-sm text-yellow-100 font-mono truncate" x-text="inputPrompt"></p>
            </div>
            <div class="flex gap-2 flex-shrink-0">
                <button @click="answerInput('y')" class="bg-green-700 hover:bg-green-600 text-white text-sm font-bold px-5 py-2 rounded-lg transition">✅ Tak (Y)</button>
                <button @click="answerInput('n')" class="bg-red-800 hover:bg-red-700 text-white text-sm font-bold px-5 py-2 rounded-lg transition">❌ Nie (N)</button>
            </div>
        </div>

        <!-- LOG RESIZE HANDLE -->
        <div class="log-resize-handle" @mousedown.prevent="startLogResize($event)" title="Przeciągnij aby zmienić wysokość panelu">
            <span></span>
        </div>

        <!-- LOG PANEL -->
        <div class="flex-shrink-0 border-t border-gray-700" :style="`height:${logHeight}px;background:#030712`">
            <div class="px-4 py-1.5 border-b border-gray-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-500 uppercase font-semibold tracking-wider">Logi generowania</span>
                    <span x-show="isRunning" class="text-xs bg-green-900 text-green-400 px-1.5 py-0.5 rounded animate-pulse">● LIVE</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs"
                          :class="{'text-green-400':genStatus==='running','text-gray-500':genStatus==='idle','text-blue-400':genStatus==='finished','text-red-400':genStatus==='failed','text-yellow-400':genStatus==='stopped'}"
                          x-text="statusLabel()"></span>
                    <button @click="clearLog()" class="text-xs text-gray-600 hover:text-gray-400 transition">Wyczyść</button>
                </div>
            </div>
            <div id="log-output" class="overflow-y-auto px-4 py-2 font-mono text-xs leading-relaxed" style="height:calc(100% - 32px)"></div>
        </div>

    </main>
</div>

<!-- ═══ FRAME MODAL ═══════════════════════════════════════════════ -->
<div x-show="frameModal.open" x-cloak
     class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4"
     @click.self="frameModal.open = false"
     @keydown.escape.window="frameModal.open = false">
    <div class="bg-gray-900 rounded-xl border border-gray-700 max-w-4xl w-full p-4">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-gray-300" x-text="frameModal.title"></h3>
            <button @click="frameModal.open = false" class="text-gray-500 hover:text-white text-xl leading-none">×</button>
        </div>

        <!-- IMAGE file — single end frame with click-to-fullscreen zoom -->
        <template x-if="frameModal.isImage">
            <div class="text-center">
                <p class="text-xs text-gray-600 mb-2">FRAME <span class="text-gray-500">(kliknij aby otworzyć w pełnym rozmiarze)</span></p>
                <img :src="frameModal.endUrl"
                     class="max-h-[70vh] mx-auto rounded object-contain bg-gray-800 cursor-zoom-in hover:opacity-90 transition-opacity"
                     @click="window.open(frameModal.endUrl,'_blank')"
                     @error="$el.alt='Brak klatki'; $el.style.opacity='0.3'">
            </div>
        </template>

        <!-- VIDEO file — start + end side by side -->
        <template x-if="!frameModal.isImage">
            <div class="flex gap-4">
                <div class="flex-1 text-center">
                    <p class="text-xs text-gray-600 mb-2">START</p>
                    <img :src="frameModal.startUrl" class="max-h-80 mx-auto rounded object-contain bg-gray-800" @error="$el.src=''">
                </div>
                <div class="flex-1 text-center">
                    <p class="text-xs text-gray-600 mb-2">END</p>
                    <img :src="frameModal.endUrl" class="max-h-80 mx-auto rounded object-contain bg-gray-800" @error="$el.src=''">
                </div>
            </div>
        </template>
    </div>
</div>

<!-- ═══ SOURCE UPLOAD MODAL ══════════════════════════════════════ -->
<template x-if="uploadModal.open">
<div class="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4"
     @click.self="uploadModal.open = false"
     @keydown.escape.window="uploadModal.open = false">
    <div class="bg-gray-900 rounded-xl border border-gray-700 w-full max-w-md p-5">

        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
            <div>
                <h3 class="text-sm font-semibold text-gray-200">Podmień plik źródłowy</h3>
                <p class="text-xs text-gray-500 font-mono mt-0.5" x-text="uploadModal.name"></p>
            </div>
            <button @click="uploadModal.open = false" class="text-gray-500 hover:text-white text-xl leading-none">×</button>
        </div>

        <!-- Current end frame preview -->
        <div class="mb-4 bg-gray-800 rounded-lg p-2 text-center" style="min-height:80px">
            <p class="text-xs text-gray-600 mb-1">Aktualny END frame</p>
            <img :src="frameUrl(uploadModal.name, 'end')"
                 class="max-h-32 mx-auto rounded object-contain"
                 @error="$el.style.display='none'">
        </div>

        <!-- Drop zone -->
        <div class="border-2 rounded-lg p-5 text-center transition-colors"
             :class="uploadModal.dragging ? 'border-blue-500 bg-blue-950/30' : 'border-dashed border-gray-600 hover:border-gray-500'"
             @dragover.prevent="uploadModal.dragging = true"
             @dragleave.prevent="uploadModal.dragging = false"
             @drop.prevent="uploadModal.dragging = false; _setUploadFile($event.dataTransfer.files[0])">

            <input type="file" x-ref="sourceFileInput"
                   accept="image/*,video/mp4,video/avi,video/quicktime,video/x-matroska"
                   class="hidden"
                   @change="_setUploadFile($event.target.files[0])">

            <template x-if="!uploadModal.file">
                <div>
                    <p class="text-gray-500 text-sm mb-2">Przeciągnij plik lub</p>
                    <button @click="$refs.sourceFileInput.click()"
                            class="text-blue-400 hover:text-blue-300 text-sm underline transition">
                        wybierz z dysku
                    </button>
                    <p class="text-gray-700 text-xs mt-2">PNG, JPG, MP4 i inne · max 500 MB</p>
                </div>
            </template>
            <template x-if="uploadModal.file">
                <div>
                    <!-- Local preview of selected file -->
                    <template x-if="uploadModal.previewUrl">
                        <img :src="uploadModal.previewUrl"
                             class="max-h-28 mx-auto rounded object-contain mb-2"
                             @error="$el.style.display='none'">
                    </template>
                    <p class="text-green-400 text-sm font-mono truncate" x-text="uploadModal.file.name"></p>
                    <p class="text-gray-500 text-xs mt-1"
                       x-text="(uploadModal.file.size / 1048576).toFixed(1) + ' MB'"></p>
                    <button @click="uploadModal.file = null; uploadModal.previewUrl = null; $refs.sourceFileInput.value = ''"
                            class="text-gray-600 hover:text-red-400 text-xs mt-2 transition">✕ usuń</button>
                </div>
            </template>
        </div>

        <!-- Save-as note: clarify that the uploaded file is always saved under the FLOW name -->
        <template x-if="uploadModal.file && uploadModal.file.name !== uploadModal.name">
            <div class="mt-3 bg-blue-950/50 border border-blue-800 rounded-lg px-3 py-2 text-xs text-blue-300">
                ℹ️ Nazwa pliku nie ma znaczenia — zostanie zapisany jako:<br>
                <span class="font-mono text-blue-200" x-text="uploadModal.name"></span>
            </div>
        </template>
        <p class="text-xs text-gray-600 mt-2">
            💾 Stary plik zostanie przeniesiony do <span class="font-mono">source_backup/</span>
        </p>

        <!-- Error -->
        <p x-show="uploadModal.error" x-cloak
           class="text-red-400 text-xs mt-2" x-text="uploadModal.error"></p>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 mt-4">
            <button @click="uploadModal.open = false"
                    :disabled="uploadModal.uploading"
                    class="px-4 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-gray-700 transition">
                Anuluj
            </button>
            <button @click="doUploadSource()"
                    :disabled="!uploadModal.file || uploadModal.uploading"
                    :class="uploadModal.file && !uploadModal.uploading
                            ? 'bg-blue-700 hover:bg-blue-600 cursor-pointer'
                            : 'bg-gray-700 opacity-40 cursor-not-allowed'"
                    class="px-4 py-2 text-sm text-white rounded-lg transition flex items-center gap-2">
                <span x-show="uploadModal.uploading" class="animate-spin inline-block">⟳</span>
                <span x-text="uploadModal.uploading ? 'Wgrywanie...' : '⬆️ Podmień'"></span>
            </button>
        </div>
    </div>
</div>
</template>

<!-- ═══ VERSIONS MODAL ════════════════════════════════════════════ -->
<div x-show="versionsModal.open" x-cloak
     class="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4"
     @click.self="versionsModal.open = false"
     @keydown.escape.window="versionsModal.open = false">
    <div class="bg-gray-900 rounded-xl border border-gray-700 max-w-2xl w-full flex flex-col" style="max-height:80vh">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-3 border-b border-gray-700 flex-shrink-0">
            <div>
                <h3 class="text-sm font-semibold text-gray-200">Wersje pliku</h3>
                <p class="text-xs text-gray-500 font-mono mt-0.5" x-text="versionsModal.name"></p>
            </div>
            <button @click="versionsModal.open = false" class="text-gray-500 hover:text-white text-xl leading-none">×</button>
        </div>

        <!-- Loading -->
        <div x-show="versionsModal.loading" class="flex items-center justify-center py-10 text-gray-500 text-sm gap-2">
            <span class="animate-spin">⟳</span> Ładowanie...
        </div>

        <!-- Empty -->
        <template x-if="!versionsModal.loading && versionsModal.files.length === 0">
            <div class="flex flex-col items-center justify-center py-10 text-gray-600 gap-2">
                <span class="text-3xl opacity-30">📭</span>
                <p class="text-sm">Brak plików (aktualnych ani archiwalnych)</p>
            </div>
        </template>

        <!-- File list -->
        <div x-show="!versionsModal.loading && versionsModal.files.length > 0"
             class="flex-1 overflow-y-auto divide-y divide-gray-800">
            <template x-for="(f, fi) in versionsModal.files" :key="f.name">
                <div class="flex items-center gap-3 px-5 py-3 hover:bg-gray-800/50 transition">
                    <!-- Badge -->
                    <span :class="f.is_current ? 'bg-green-900 text-green-300' : 'bg-gray-800 text-gray-500'"
                          class="flex-shrink-0 text-xs px-2 py-0.5 rounded font-medium"
                          x-text="f.is_current ? 'AKTUALNY' : 'ARCHIW'"></span>

                    <!-- File info -->
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-mono text-gray-300 truncate" x-text="f.name"></p>
                        <p class="text-xs text-gray-600 mt-0.5"
