<!-- ═══ JS ════════════════════════════════════════════════════════ -->
<script>
function app() {
    return {
        // ─ State ──────────────────────────────────────────
        comfyuiUrl: 'http://127.0.0.1:8189',
        runs: [], runsLoading: true, runsError: null,
        selectedRun: null,
        flowData: null, flowLoading: false, flowError: null,
        statusData: null,
        ws: null, wsConnected: false,
        genStatus: 'idle', genFile: null,
        awaitingInput: false, inputPrompt: '',
        frameModal: { open: false, title: '', isImage: false, startUrl: '', endUrl: '' },
        videoModal: { open: false, name: '', url: '' },
        versionsModal: { open: false, name: '', files: [], loading: false },
        uploadModal:   { open: false, name: '', file: null, previewUrl: null, uploading: false, error: null, dragging: false },
        frameVersion:  Date.now(),
        negOpen: {},
        logHeight: 160,
        _genPyBusy: false,
        _reformatBusy: false,
        sourceModal: { open: false, filename: '', content: '' },
        _logResizing: false, _logResizeStartY: 0, _logResizeStartH: 0,

        // ─ Computed ───────────────────────────────────────
        get isRunning() { return this.genStatus === 'running'; },
        get _runIsReady() {
            const c = this.selectedRun?.compatibility;
            return c === 'current' || c === 'yaml';
        },
        get canGenerate() {
            return !this.isRunning
                && this._runIsReady
                && !this.selectedRun?.syntax_error
                && !!this.flowData;
        },
        get toolbarStatus() {
            if (this.isRunning) return `Generowanie: ${this.genFile || '...'}`;
            if (!this.selectedRun) return 'Wybierz projekt aby zacząć';
            if (!this._runIsReady) return '⚠️ Stary format';
            if (this.selectedRun.syntax_error) return '❌ Błąd składni w pliku RUN';
            return `Projekt: ${this.selectedRun.display_name}`;
        },
        get toolbarStatusExtra() {
            // shown when genStatus is running and we know we're in only-mode
            // (status message is pushed from backend via WS, no extra state needed here)
            return '';
        },

        // ─ Init ───────────────────────────────────────────
        async init() {
            try {
                const cfg = await fetch('/api/config').then(r => r.json());
                if (cfg.comfyui_url) this.comfyuiUrl = cfg.comfyui_url;
            } catch(e) {}
            this.connectWS();
            await this.loadRuns();
        },

        // ─ WebSocket ──────────────────────────────────────
        _wsFailCount: 0,
        connectWS() {
            // Guard: don't open a second connection if one is already live
            if (this.ws && (this.ws.readyState === WebSocket.OPEN ||
                            this.ws.readyState === WebSocket.CONNECTING)) return;

            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            let opened = false;
            try { this.ws = new WebSocket(`${proto}://${location.host}/ws/logs`); } catch { return; }

            this.ws.onopen = () => {
                opened = true;
                this._wsFailCount = 0;
                this.wsConnected = true;
                this.logLine('sys','🔌 WebSocket połączony');
            };
            this.ws.onclose = () => {
                this.wsConnected = false;
                if (!opened) {
                    // Connection was never established — likely auth error (403)
                    // Use exponential backoff, stop after 5 consecutive failures
                    this._wsFailCount++;
                    if (this._wsFailCount >= 5) {
                        this.logLine('sys','🔌 WebSocket — zbyt wiele błędów, odśwież stronę');
                        return;
                    }
                    const delay = Math.min(3000 * this._wsFailCount, 30000);
                    setTimeout(() => this.connectWS(), delay);
                } else {
                    // Was connected before — normal disconnect, retry quickly
                    this._wsFailCount = 0;
                    this.logLine('sys','🔌 WebSocket rozłączony — ponawiam za 3s...');
                    setTimeout(() => this.connectWS(), 3000);
                }
            };
            this.ws.onerror = () => {};
            this.ws.onmessage = (evt) => {
                let msg; try { msg = JSON.parse(evt.data); } catch { return; }
                if (msg.type === 'ping') return;
                if (msg.type === 'status') {
                    this.genStatus = msg.status || 'idle';
                    if (msg.file) this.genFile = msg.file;
                    if (typeof msg.awaiting_input === 'boolean') this.awaitingInput = msg.awaiting_input;
                    // Auto-refresh status when generation finishes
                    if (msg.status === 'finished' || msg.status === 'failed') {
                        this._dryRunMode = false;  // always clear on process end
                        this.refreshStatus();
                    }
                    return;
                }
                if (msg.type === 'input_needed') { this._handleInputNeeded(msg.prompt || ''); return; }
                if (msg.type === 'log') {
                    const t = msg.text || '';
                    // Filter verbose debug lines from generation script
                    const isDebug = t.startsWith('🐛') ||
                                    t.startsWith('from_config:') ||
                                    t.startsWith('to_config:') ||
                                    t.startsWith('default_backend:') ||
                                    t.startsWith('📁 Normal transition') ||
                                    t.startsWith('⛓️ Chain file generation') ||
                                    t.startsWith('Using prompt:');
                    if (!isDebug) this.logLine(msg.stream, t);
                }
            };
        },

        // ─ Generation ─────────────────────────────────────
        async startGeneration() {
            if (!this.canGenerate) return;
            this._dryRunMode = false;   // safety: clear any stale dry-run flag
            const conflicts = this._getFlowConflicts();
            if (conflicts.length > 0) {
                this.preflightModal = { open: true, conflicts, onConfirm: () => this._doStartGeneration() };
                return;
            }
            await this._doStartGeneration();
        },

        async _doStartGeneration() {
            this.preflightModal.open = false;
            try {
                const res = await fetch(`/api/generate/${encodeURIComponent(this.selectedRun.filename)}`, { method: 'POST' });
                if (!res.ok) { const e = await res.json(); this.logLine('sys', `❌ ${e.detail}`); }
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },
        async stopGeneration() {
            if (!this.isRunning) return;
            try { await fetch('/api/generate', { method: 'DELETE' }); } catch(e) {}
        },
        async dryRun() {
            if (!this.canGenerate || this.isRunning) return;
            // 1. Clear frame thumbnail cache so all thumbs are re-extracted from source
            try {
                await fetch('/api/media/clear-frame-cache', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: this.selectedRun.filename }),
                });
            } catch(e) {}
            // 2. Bump frameVersion → browser re-fetches all thumbnails
            this.frameVersion = Date.now();
            // 3. Dry-run: start generation, auto-answer N at the first prompt
            this.logLine('sys', '🔍 Sprawdzam status i odświeżam miniatury (auto-odpowiedź N)...');
            this._dryRunMode = true;
            try {
                const res = await fetch(`/api/generate/${encodeURIComponent(this.selectedRun.filename)}`, { method: 'POST' });
                if (!res.ok) { const e = await res.json(); this.logLine('sys', `❌ ${e.detail}`); this._dryRunMode = false; }
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); this._dryRunMode = false; }
        },
        async answerInput(answer) {
            // If dry-run mode auto-answering N, clear flag
            if (this._dryRunMode && answer !== 'n') { answer = 'n'; }
            this._dryRunMode = false;
            this.awaitingInput = false;
            this.logLine('sys', `→ Wysyłam odpowiedź: ${answer.toUpperCase()}`);
            try {
                await fetch('/api/generate/stdin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: answer }),
                });
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },

        // ─ Log panel resize ───────────────────────────────
        startLogResize(e) {
            this._logResizing = true;
            this._logResizeStartY = e.clientY;
            this._logResizeStartH = this.logHeight;
            const move = (ev) => {
                if (!this._logResizing) return;
                const delta = this._logResizeStartY - ev.clientY;
                this.logHeight = Math.max(80, Math.min(window.innerHeight * 0.8, this._logResizeStartH + delta));
            };
            const up = () => {
                this._logResizing = false;
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', up);
            };
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
        },

        // ─ Dry-run auto-answer hook ────────────────────────
        _dryRunMode: false,

        // When input_needed arrives during dry-run, auto-answer N
        _handleInputNeeded(prompt) {
            this.awaitingInput = true;
            this.inputPrompt = prompt;
            if (this._dryRunMode) {
                setTimeout(() => this.answerInput('n'), 300);
            }
        },

        // ─ Runs ───────────────────────────────────────────
        async loadRuns() {
            this.runsLoading = true; this.runsError = null;
            try {
                const res = await fetch('/api/runs');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                this.runs = await res.json();
                this.logLine('sys', `Załadowano ${this.runs.length} projektów`);
            } catch(e) { this.runsError = e.message; this.logLine('sys', `❌ ${e.message}`); }
            finally { this.runsLoading = false; }
        },
        async selectRun(run) {
            this.selectedRun = run; this.flowData = null; this.flowError = null; this.statusData = null;
            this.editMode = false;  // reset on run switch
            this.postMode = false;  // reset to flow view on run switch
            this.logLine('sys', `Wybrano: ${run.display_name} [${run.compatibility}]`);
            if (run.syntax_error) {
                this.logLine('sys', `❌ Błąd składni linia ${run.syntax_error.line}: ${run.syntax_error.msg}`);
                return;
            }
            const ready = run.compatibility === 'current' || run.compatibility === 'yaml';
            if (ready) {
                await Promise.all([this.loadFlow(run.filename), this.refreshStatus()]);
            }
        },
        async loadFlow(filename) {
            this.flowLoading = true; this.flowError = null;
            try {
                const res = await fetch(`/api/runs/${encodeURIComponent(filename)}/flow`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                this.flowData = await res.json();
                this.logLine('sys', `FLOW: ${this.flowData.item_count} elementów (${this.flowData.flow_type})`);
            } catch(e) { this.flowError = e.message; }
            finally { this.flowLoading = false; }
        },

        // ─ Status ─────────────────────────────────────────
        async refreshStatus() {
            if (!this.selectedRun) return;
            try {
                const res = await fetch(`/api/runs/${encodeURIComponent(this.selectedRun.filename)}/status`);
                if (!res.ok) return;
                this.statusData = await res.json();
            } catch(e) {}
        },

        // ── Status helpers — all O(1), no indexOf/find ────────────────
        // statusData.items[idx] corresponds 1:1 with flowData.flow[idx]
        _si(idx) { return this.statusData?.items?.[idx] ?? null; },

        // border class for FILE row
        fileItemBorderClass(idx) {
            const st = this._si(idx)?.status;
            if (st === 'green') return 'sl-green';
            if (st === 'red')   return 'sl-red';
            if (st === 'gray')  return 'sl-gray';
            return '';
        },
        fileItemIsGreen(idx)   { return this._si(idx)?.status === 'green'; },
        fileItemIsRed(idx)     { return this._si(idx)?.status === 'red'; },
        fileItemIsGray(idx)    { return this._si(idx)?.status === 'gray'; },
        fileItemName(idx)      { return this._si(idx)?.name ?? null; },
        fileItemSizeMb(idx)    { const mb = this._si(idx)?.size_mb; return mb ? `${mb} MB` : ''; },
        fileItemHasVersions(idx) { return this._si(idx)?.has_versions === true; },
        fileItemHasArchived(idx) { return this._si(idx)?.has_archived === true; },
        fileItemSourceSizeMb(idx) { const mb = this._si(idx)?.source_size_mb; return mb ? `${mb} MB` : ''; },

        // chain status — called ONCE each, not 3× per item
        chainStatusOk(idx)    { return !!(this._si(idx)?.steps); },
        chainStatusClass(idx) {
            const st = this._si(idx)?.status;
            if (st === 'green')   return 'text-green-400';
            if (st === 'partial') return 'text-yellow-400';
            return 'text-red-400';
        },
        chainStatusLabel(idx) {
            const s = this._si(idx);
            if (!s?.steps) return '';
            const total = s.steps.length;
            const done  = s.steps.filter(x => x.exists).length;
            if (s.status === 'green')   return `✅ ${done}/${total}`;
            if (s.status === 'partial') return `⚡ ${done}/${total}`;
            return `○ ${total - done} brak`;
        },
        chainBorderClass(idx) {
            const st = this._si(idx)?.status;
            if (st === 'green')   return 'sl-green';
            if (st === 'red')     return 'sl-red';
            if (st === 'partial') return 'border-l-4 border-l-yellow-700';
            return '';
        },
        chainStepHasVersions(idx, si) { return this._si(idx)?.steps?.[si]?.has_versions === true; },
        chainStepHasArchived(idx, si) { return this._si(idx)?.steps?.[si]?.has_archived === true; },

        itemExists(filename) {
            if (!this.statusData) return false;
            return this.statusData.items.some(s => {
                if (s.steps) return s.steps.some(st => st.filename === filename && st.exists);
                return s.name === filename && s.status === 'green';
            });
        },

        // ─ Media ──────────────────────────────────────────
        frameUrl(file, kind) {
            if (!this.selectedRun) return '';
            // frameVersion busts cache after source-file upload
            return `/api/media/frame?run=${encodeURIComponent(this.selectedRun.filename)}&file=${encodeURIComponent(file)}&kind=${kind}&v=${this.frameVersion}`;
        },
        thumbUrl(file, kind) { return this.frameUrl(file, kind); },

        openFrameModal(file) {
            const ext = (file.split('.').pop() || '').toLowerCase();
            const isImage = ['jpg','jpeg','png','webp','gif','bmp','tiff','tif'].includes(ext);
            this.frameModal = {
                open:     true,
                title:    file,
                isImage:  isImage,
                startUrl: isImage ? '' : this.frameUrl(file, 'start'),
                endUrl:   this.frameUrl(file, 'end'),
            };
        },
        openVideoModal(name) {
            if (!name || !this.selectedRun) return;
            this.videoModal = {
                open: true,
                name: name,
                url: `/api/media/video?run=${encodeURIComponent(this.selectedRun.filename)}&name=${encodeURIComponent(name)}`,
            };
        },
        openSourceVideoModal(filename) {
            if (!filename || !this.selectedRun) return;
            this.videoModal = {
                open: true,
                name: filename,
                url: `/api/media/source-video?run=${encodeURIComponent(this.selectedRun.filename)}&name=${encodeURIComponent(filename)}`,
            };
        },
        closeVideoModal() {
            if (this.$refs.videoPlayer) { this.$refs.videoPlayer.pause(); this.$refs.videoPlayer.src = ''; }
            this.videoModal = { open: false, name: '', url: '' };
        },

        openSourceUpload(filename) {
            if (this.uploadModal.previewUrl) URL.revokeObjectURL(this.uploadModal.previewUrl);
            this.uploadModal = { open: true, name: filename, file: null, previewUrl: null, uploading: false, error: null, dragging: false };
        },
        _setUploadFile(file) {
            if (!file) return;
            if (this.uploadModal.previewUrl) URL.revokeObjectURL(this.uploadModal.previewUrl);
            this.uploadModal.file = file;
            // Local preview for images
            if (file.type.startsWith('image/')) {
                this.uploadModal.previewUrl = URL.createObjectURL(file);
            } else {
                this.uploadModal.previewUrl = null;
            }
        },
        async doUploadSource() {
            if (!this.uploadModal.file || !this.selectedRun) return;
            this.uploadModal.uploading = true;
            this.uploadModal.error = null;

            const fd = new FormData();
            fd.append('run',  this.selectedRun.filename);
            fd.append('name', this.uploadModal.name);
            fd.append('file', this.uploadModal.file);

            try {
                const res  = await fetch('/api/media/upload-source', { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) {
                    this.uploadModal.error = data.detail || 'Błąd uploadu';
                    return;
                }
                const note = data.archived ? ` (backup → source_backup/${data.archived})` : '';
                this.logLine('sys', `⬆️ Podmieniono: ${data.name}${note}`);
                if (this.uploadModal.previewUrl) URL.revokeObjectURL(this.uploadModal.previewUrl);
                this.uploadModal.open = false;
                this.frameVersion = Date.now();   // bust browser thumbnail cache → reload all frames
                await this.refreshStatus();
            } catch(e) {
                this.uploadModal.error = e.message;
            } finally {
                this.uploadModal.uploading = false;
            }
        },

        async openVersionsModal(name) {
            if (!name || !this.selectedRun) return;
            this.versionsModal = { open: true, name, files: [], loading: true };
            try {
                const res = await fetch(
                    `/api/media/versions?run=${encodeURIComponent(this.selectedRun.filename)}&name=${encodeURIComponent(name)}`
                );
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                this.versionsModal.files = data.files || [];
            } catch(e) {
                this.logLine('sys', `❌ Błąd ładowania wersji: ${e.message}`);
                this.versionsModal.open = false;
            } finally {
                this.versionsModal.loading = false;
            }
        },
        openVideoModalFromVersions(name) {
            // Open video player without closing versions modal
            if (!name || !this.selectedRun) return;
            this.videoModal = {
                open: true,
                name: name,
                url: `/api/media/video?run=${encodeURIComponent(this.selectedRun.filename)}&name=${encodeURIComponent(name)}`,
            };
        },
        async restoreFile(name, fileIndex) {
            if (!this.selectedRun) return;

            // ── Detect chain file and warn about missing previous steps ──
            // name can be "prefix_003.mp4" (current) or "prefix_003_ver260520070004.mp4" (archived)
            const chainMatch = name.match(/^(.+)_(\d{3})(?:_ver\d{12})?\.mp4$/);
            let missingPrev = [];

            if (chainMatch && this.statusData) {
                const chainPrefix = chainMatch[1];
                const stepNum = parseInt(chainMatch[2]); // 1-based
                for (let i = 1; i < stepNum; i++) {
                    const prevName = `${chainPrefix}_${String(i).padStart(3, '0')}.mp4`;
                    const exists = this.statusData.items.some(s =>
                        s.steps ? s.steps.some(st => st.filename === prevName && st.exists) : false
                    );
                    if (!exists) missingPrev.push(prevName);
                }
            }

            const cascadeNote = missingPrev.length
                ? `\n\n⚠ Uwaga: poprzednie kroki brakują:\n${missingPrev.join('\n')}\n\nPrzywróć je ręcznie przez 📂 lub re-generuj od brakującego kroku.`
                : '';
            if (!confirm(`Przywrócić jako aktualny:\n${name}?${cascadeNote}\n\nAktualny plik (jeśli istnieje) zostanie zarchiwizowany.`)) return;

            // ── Restore the explicitly chosen file ────────────────────
            try {
                const res  = await fetch('/api/media/restore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: this.selectedRun.filename, name }),
                });
                const data = await res.json();
                if (!res.ok) { this.logLine('sys', `❌ ${data.detail}`); return; }

                const note = data.displaced ? ` (stary → ${data.displaced})` : '';
                this.logLine('sys', `↩ Przywrócono: ${data.restored}${note}`);

                // Close modal and refresh status
                this.versionsModal.open = false;
                this.statusData = null;
                await this.refreshStatus();
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },

        async trashFile(name, fileIndex) {
            if (!confirm(`Przenieść do kosza Windows:\n${name}\n\n(plik można odzyskać z Eksploratora plików)`)) return;
            try {
                const res = await fetch('/api/media/trash', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: this.selectedRun.filename, name }),
                });
                const data = await res.json();
                if (res.ok) {
                    this.logLine('sys', `🗑 Do kosza: ${name}`);
                    // Remove from modal list
                    this.versionsModal.files.splice(fileIndex, 1);
                    // Refresh status badges
                    await this.refreshStatus();
                } else {
                    this.logLine('sys', `❌ ${data.detail}`);
                }
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },

        async regenFile(name) {
            if (!name || !this.selectedRun || this.isRunning) return;
            if (!confirm(`Re-generować: ${name}?\n\nPlik zostanie zarchiwizowany (_ver...) jako backup.`)) return;

            // 1. Archive current file (backup)
            this.logLine('sys', `📦 Re-gen: archiwizuję ${name}...`);
            try {
                const res = await fetch('/api/media/archive', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: this.selectedRun.filename, name }),
                });
                const data = await res.json();
                if (!res.ok) { this.logLine('sys', `❌ Błąd archiwizacji: ${data.detail}`); return; }
                this.logLine('sys', `📦 Backup: ${data.new_name}`);
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); return; }

            // 2. Start targeted generation — only this one transition
            this.logLine('sys', `▶ Uruchamiam generowanie: tylko ${name}`);
            await this._startOnly([name]);
        },

        // Re-generate a chain step AND all subsequent steps.
        // fromSi: 0-based index of the step to start from.
        // totalSteps: item.chain.length
        async regenChainFrom(chainPrefix, fromSi, totalSteps) {
            if (!chainPrefix || !this.selectedRun || this.isRunning) return;

            // Build filenames for step fromSi … totalSteps-1
            const names = [];
            for (let i = fromSi; i < totalSteps; i++) {
                names.push(`${chainPrefix}_${String(i+1).padStart(3,'0')}.mp4`);
            }

            const stepLabel = `step ${fromSi + 1}`;
            const rangeLabel = names.length === 1
                ? names[0]
                : `${names[0]} … ${names[names.length-1]} (${names.length} pliki)`;

            if (!confirm(`Re-generować chain od ${stepLabel}?\n\n${rangeLabel}\n\nIstniejące pliki zostaną zarchiwizowane.`)) return;

            // Batch-archive with shared timestamp (files that don't exist are silently skipped)
            try {
                const res  = await fetch('/api/media/batch-archive', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: this.selectedRun.filename, names }),
                });
                const data = await res.json();
                if (res.ok) {
                    for (const r of data.results) {
                        if (r.ok) this.logLine('sys', `📦 Backup [${data.ts}]: ${r.new_name}`);
                        // silently skip files that didn't exist
                    }
                } else {
                    this.logLine('sys', `❌ batch-archive: ${data.detail || res.status}`);
                }
            } catch(e) { this.logLine('sys', `❌ batch-archive: ${e.message}`); }

            const stepRange = names.length === 1
                ? names[0]
                : `${names.length} kroki (step ${fromSi+1}–${totalSteps})`;
            this.logLine('sys', `▶ Re-gen chain: ${stepRange}`);
            await this._startOnly(names);
        },

        async _startOnly(names) {
            // Start generation targeting only specific transition files.
            // names: array of output filenames (e.g. ["foo_bar_transition.mp4"])
            if (!this.canGenerate) return;
            try {
                const res = await fetch(
                    `/api/generate/${encodeURIComponent(this.selectedRun.filename)}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ only: names }),
                    }
                );
                if (!res.ok) { const e = await res.json(); this.logLine('sys', `❌ ${e.detail}`); }
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },

        // Archive a chain step AND all subsequent steps (cascade).
        async archiveChainFrom(chainPrefix, fromSi, totalSteps) {
            if (!chainPrefix || !this.selectedRun) return;

            const names = [];
            for (let i = fromSi; i < totalSteps; i++) {
                names.push(`${chainPrefix}_${String(i+1).padStart(3,'0')}.mp4`);
            }

            const rangeLabel = names.length === 1
                ? names[0]
                : `${names[0]} … ${names[names.length-1]} (${names.length} pliki)`;

            if (!confirm(`Archiwizować chain od step ${fromSi+1}?\n\n${rangeLabel}\n\nPliki zostaną przemianowane, nie usunięte.`)) return;

            // Batch-archive with shared timestamp
            try {
                const res  = await fetch('/api/media/batch-archive', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: this.selectedRun.filename, names }),
                });
                const data = await res.json();
                if (res.ok) {
                    for (const r of data.results) {
                        if (r.ok) this.logLine('sys', `📦 Backup [${data.ts}]: ${r.new_name}`);
                        else      this.logLine('sys', `⚠ ${r.name}: ${r.error}`);
                    }
                } else {
                    this.logLine('sys', `❌ batch-archive: ${data.detail || res.status}`);
                }
            } catch(e) { this.logLine('sys', `❌ batch-archive: ${e.message}`); }
            this.statusData = null; await this.refreshStatus();
        },

        async archiveFile(name) {
            if (!name || !this.selectedRun) return;
            if (!confirm(`Archiwizować ${name}?\n(plik zostanie przemianowany, nie usunięty)`)) return;
            try {
                const res = await fetch('/api/media/archive', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: this.selectedRun.filename, name }),
                });
                const data = await res.json();
                if (res.ok) {
                    this.logLine('sys', `📦 Zarchiwizowano: ${name} → ${data.new_name}`);
                    await this.refreshStatus();
                } else {
                    this.logLine('sys', `❌ ${data.detail}`);
                }
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },

        // ─ View mode ──────────────────────────────────────
        postMode: false,
        preMode:  false,

        // ─ Pre-processing ─────────────────────────────────
        preClips:       [],
        preLoading:     false,
        preTargetW:     1024,
        preTargetH:     1024,
        preSelected:    {},     // { [clip.name]: true }
        preQueue:       [],     // [{ clip, status, elapsed_s, error }]
        preQueueStatus: {},     // { [clip.name]: 'pending'|'running'|'done'|'error' }
        preIsRunning:   false,
        _prePolling:    null,

        // ─ Post-processing ────────────────────────────────
        postClips:         [],
        postClipOffsets:   [],   // cumulative seconds before clip[i]
        postCurrentIndex:  -1,
        postSelectedIndex: -1,
        postProgress:      0,
        postFilmPosition:  0,    // seconds from film start (for display)
        postIsPlaying:     false,
        postLoading:       false,

        // ─ Upscale modal ──────────────────────────────────────
        upscaleModal: {
            open:      false,
            clip:      null,
            width:     1024,
            height:    1024,
            status:    'idle',    // idle | queued | running | done | error
            error:     null,
            elapsed_s: null,
            _timer:    null,
        },

        postSelectedClip()   { return this.postClips[this.postSelectedIndex] ?? null; },
        postCurrentClipName(){ return this.postClips[this.postCurrentIndex]?.name ?? ''; },

        postFmtTime(secs) {
            if (secs == null || secs < 0) return '—';
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        },
        postTimeDisplay() {
            const total = this.postClipOffsets[this.postClips.length] ?? 0;
            return `${this.postFmtTime(this.postFilmPosition)} / ${this.postFmtTime(total)}`;
        },

        postClipVideoUrl(clip) {
            if (!clip || !this.selectedRun) return '';
            const run  = encodeURIComponent(this.selectedRun.filename);
            const name = encodeURIComponent(clip.name);
            const v    = clip.mtime ? `&v=${clip.mtime}` : '';
            return clip.type === 'external'
                ? `/api/media/source-video?run=${run}&name=${name}${v}`
                : `/api/media/video?run=${run}&name=${name}${v}`;
        },
        postClipThumbUrl(clip) {
            if (!clip || !this.selectedRun) return '';
            const run  = encodeURIComponent(this.selectedRun.filename);
            const name = encodeURIComponent(clip.name);
            return clip.type === 'external'
                ? `/api/media/frame?run=${run}&file=${name}&kind=start`
                : `/api/media/video-thumb?run=${run}&name=${name}`;
        },
        postTileClass(i) {
            const playing  = i === this.postCurrentIndex;
            const selected = i === this.postSelectedIndex;
            if (playing && selected) return 'border-green-400';
            if (playing)  return 'border-green-600';
            if (selected) return 'border-blue-500';
            return 'border-transparent hover:border-gray-600';
        },

        async loadPostClips(preserveScroll = false) {
            if (!this.selectedRun) return;
            // Save filmstrip scroll position before refresh
            const filmstrip = this.$refs.postFilmstrip;
            const savedScroll = preserveScroll && filmstrip ? filmstrip.scrollLeft : 0;

            this.postLoading = true;
            if (!preserveScroll) {
                this.postClips = [];
                this.postCurrentIndex  = -1;
                this.postSelectedIndex = -1;
                this.postProgress      = 0;
                this.postFilmPosition  = 0;
            }
            try {
                const res = await fetch(`/api/runs/${encodeURIComponent(this.selectedRun.filename)}/postclips`);
                if (res.ok) {
                    this.postClips = await res.json();
                    // Build cumulative offsets: postClipOffsets[i] = seconds before clip i
                    const offsets = [];
                    let acc = 0;
                    for (const clip of this.postClips) {
                        offsets.push(acc);
                        acc += clip.duration_s ?? 0;
                    }
                    offsets.push(acc); // total film duration at index [length]
                    this.postClipOffsets = offsets;
                }
            } catch(e) { console.error('postclips fetch error', e); }
            finally {
                this.postLoading = false;
                // Restore scroll position after Alpine re-renders the list
                if (preserveScroll && savedScroll > 0) {
                    this.$nextTick(() => {
                        const fs = this.$refs.postFilmstrip;
                        if (fs) fs.scrollLeft = savedScroll;
                    });
                }
            }
        },

        postSelectClip(i) {
            this.postSelectedIndex = i;
            // Load into player but don't autoplay
            const clip = this.postClips[i];
            if (!clip) return;
            const p = this.$refs.postPlayer;
            if (!p) return;
            if (p.src !== this.postClipVideoUrl(clip)) {
                p.src = this.postClipVideoUrl(clip);
                p.load();
            }
            this.postCurrentIndex = i;
        },
        postPlayFrom(i) {
            this.postSelectedIndex = i;
            this.postCurrentIndex  = i;
            const clip = this.postClips[i];
            if (!clip) return;
            const p = this.$refs.postPlayer;
            if (!p) return;
            p.src = this.postClipVideoUrl(clip);
            p.load();
            p.play().catch(() => {});
            this._postScrollTo(i);
        },
        postPlayNext() {
            const next = this.postCurrentIndex + 1;
            if (next < this.postClips.length) {
                this.postCurrentIndex  = next;
                this.postSelectedIndex = next;
                const p = this.$refs.postPlayer;
                if (!p) return;
                p.src = this.postClipVideoUrl(this.postClips[next]);
                p.load();
                p.play().catch(() => {});
                this.$nextTick(() => this._postScrollTo(next));
            } else {
                this.postIsPlaying = false;
            }
        },
        postPlayPrev() {
            const prev = this.postCurrentIndex - 1;
            if (prev >= 0) this.postPlayFrom(prev);
        },
        postTogglePlay() {
            const p = this.$refs.postPlayer;
            if (!p) return;
            if (p.paused) { p.play().catch(() => {}); }
            else          { p.pause(); }
        },
        postUpdateProgress() {
            const p = this.$refs.postPlayer;
            if (!p || !p.duration) return;
            this.postProgress = (p.currentTime / p.duration) * 100;
            this.postFilmPosition = (this.postClipOffsets[this.postCurrentIndex] ?? 0) + p.currentTime;
        },
        postSeek(e) {
            const p = this.$refs.postPlayer;
            if (!p || !p.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            p.currentTime = ((e.clientX - rect.left) / rect.width) * p.duration;
        },
        _postScrollTo(i) {
            this.$nextTick(() => {
                const tile = document.querySelector(`[data-clip-idx="${i}"]`);
                if (tile) tile.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            });
        },
        async postArchiveClip(clip) {
            if (!clip || !this.selectedRun) return;
            try {
                const res = await fetch('/api/media/archive', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: this.selectedRun.filename, name: clip.name }),
                });
                const data = await res.json();
                if (data.ok) {
                    this.logLine('sys', `📦 Zarchiwizowano: ${clip.name} → ${data.new_name}`);
                    await Promise.all([this.loadPostClips(true), this.refreshStatus()]);
                } else {
                    this.logLine('sys', `❌ ${data.detail || data.error}`);
                }
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },
        async postTrashClip(clip) {
            if (!clip || !this.selectedRun) return;
            try {
                const res = await fetch('/api/media/trash', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run: this.selectedRun.filename, name: clip.name }),
                });
                const data = await res.json();
                if (data.ok) {
                    this.logLine('sys', `🗑 Usunięto: ${clip.name}`);
                    await Promise.all([this.loadPostClips(true), this.refreshStatus()]);
                } else {
                    this.logLine('sys', `❌ ${data.detail || data.error}`);
                }
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },

        // ─ Upscale ────────────────────────────────────────
        openUpscaleModal(clip) {
            if (!clip) return;
            // Pre-fill: project force_resolution → default_resolution → 1024×1024
            const res = this.selectedRun?.force_resolution
                     || this.selectedRun?.default_resolution
                     || null;
            const w = res ? res[0] : 1024;
            const h = res ? res[1] : 1024;
            this.upscaleModal = {
                open:      true,
                clip,
                width:     w,
                height:    h,
                status:    'idle',
                error:     null,
                elapsed_s: null,
                _timer:    null,
            };
        },
        closeUpscaleModal() {
            if (this.upscaleModal._timer) {
                clearInterval(this.upscaleModal._timer);
            }
            this.upscaleModal.open = false;
        },
        async startUpscale() {
            const m = this.upscaleModal;
            if (!m.clip || !this.selectedRun) return;
            m.status = 'queued';
            m.error  = null;
            try {
                const res = await fetch('/api/upscale/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        run:    this.selectedRun.filename,
                        name:   m.clip.name,
                        type:   m.clip.type,
                        width:  parseInt(m.width)  || 1024,
                        height: parseInt(m.height) || 1024,
                    }),
                });
                const data = await res.json();
                if (!data.ok && !res.ok) {
                    m.status = 'error';
                    m.error  = data.detail || data.error || 'Błąd startu upscalingu';
                    return;
                }
                // Start polling
                m._timer = setInterval(() => this._pollUpscale(), 3000);
            } catch(e) {
                m.status = 'error';
                m.error  = e.message;
            }
        },
        async _pollUpscale() {
            const m = this.upscaleModal;
            try {
                const res  = await fetch('/api/upscale/status');
                const data = await res.json();
                m.status    = data.status;
                m.elapsed_s = data.elapsed_s;
                if (data.status === 'done') {
                    clearInterval(m._timer);
                    m._timer = null;
                    this.logLine('sys', `⬆ Upscale gotowy: ${data.output_name} (${data.elapsed_s}s)`);
                    await Promise.all([this.loadPostClips(true), this.refreshStatus()]);
                } else if (data.status === 'error') {
                    clearInterval(m._timer);
                    m._timer = null;
                    m.error  = data.error || 'Nieznany błąd';
                }
            } catch(e) { /* ignore transient network error */ }
        },

        // ─ Pre-processing ─────────────────────────────────
        async loadPreClips() {
            this.preLoading = true;
            this.preClips = [];
            this.preSelected = {};
            this.preQueue = [];
            this.preQueueStatus = {};
            try {
                const res = await fetch(`/api/runs/${encodeURIComponent(this.selectedRun.filename)}/postclips`);
                if (res.ok) {
                    const all = await res.json();
                    // Only video clips; skip archive files (_ver*, _beforeupscale*)
                    this.preClips = all.filter(c =>
                        !c.name.includes('_ver') && !c.name.includes('_beforeupscale')
                    );
                    // Set default target from project force_resolution
                    const fr = this.selectedRun?.force_resolution;
                    if (fr) { this.preTargetW = fr[0]; this.preTargetH = fr[1]; }
                    // Auto-select files below target
                    this.preSelectBelowTarget();
                }
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
            this.preLoading = false;
        },

        preBelowTarget(clip) {
            if (clip.status !== 'ok' || clip.width === null || clip.height === null) return false;
            return clip.width < this.preTargetW || clip.height < this.preTargetH;
        },

        preSelectBelowTarget() {
            const sel = {};
            for (const c of this.preClips) {
                if (this.preBelowTarget(c)) sel[c.name] = true;
            }
            this.preSelected = sel;
        },

        preToggle(name) {
            if (this.preSelected[name]) {
                const copy = {...this.preSelected};
                delete copy[name];
                this.preSelected = copy;
            } else {
                this.preSelected = {...this.preSelected, [name]: true};
            }
        },

        preSelectedCount() {
            return Object.keys(this.preSelected).length;
        },

        async preStartBatch() {
            if (this.preIsRunning) return;
            const selected = this.preClips.filter(c => this.preSelected[c.name]);
            if (selected.length === 0) return;

            this.preQueue = selected.map(c => ({
                clip: c, status: 'pending', elapsed_s: null, error: null,
            }));
            // Build quick-lookup map for inline status badges in the file list
            this.preQueueStatus = Object.fromEntries(selected.map(c => [c.name, 'pending']));
            this.preIsRunning = true;
            await this._preRunNext();
        },

        async _preRunNext() {
            const item = this.preQueue.find(i => i.status === 'pending');
            if (!item) {
                // All done
                this.preIsRunning = false;
                await Promise.all([this.loadPostClips(true), this.refreshStatus()]);
                return;
            }
            item.status = 'running';
            this.preQueueStatus = {...this.preQueueStatus, [item.clip.name]: 'running'};

            try {
                const res = await fetch('/api/upscale/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        run:    this.selectedRun.filename,
                        name:   item.clip.name,
                        type:   item.clip.type,
                        width:  parseInt(this.preTargetW)  || 1024,
                        height: parseInt(this.preTargetH) || 1024,
                    }),
                });
                const data = await res.json();
                if (!data.ok || !res.ok) {
                    item.status = 'error';
                    item.error = data.detail || data.error || 'Błąd startu';
                    this.preQueueStatus = {...this.preQueueStatus, [item.clip.name]: 'error'};
                    await this._preRunNext();
                    return;
                }
                // Poll until done then advance queue
                this._prePolling = setInterval(() => this._prePollCurrent(item), 3000);
            } catch(e) {
                item.status = 'error';
                item.error = e.message;
                this.preQueueStatus = {...this.preQueueStatus, [item.clip.name]: 'error'};
                await this._preRunNext();
            }
        },

        async _prePollCurrent(item) {
            try {
                const res  = await fetch('/api/upscale/status');
                const data = await res.json();
                item.elapsed_s = data.elapsed_s;

                if (data.status === 'done') {
                    clearInterval(this._prePolling);
                    item.status    = 'done';
                    item.elapsed_s = data.elapsed_s;
                    this.preQueueStatus = {...this.preQueueStatus, [item.clip.name]: 'done'};
                    // Refresh clip metadata so new resolution shows immediately
                    const refreshed = await fetch(`/api/runs/${encodeURIComponent(this.selectedRun.filename)}/postclips`);
                    if (refreshed.ok) {
                        const all = await refreshed.json();
                        this.preClips = all.filter(c =>
                            !c.name.includes('_ver') && !c.name.includes('_beforeupscale')
                        );
                    }
                    await this._preRunNext();
                } else if (data.status === 'error') {
                    clearInterval(this._prePolling);
                    item.status = 'error';
                    item.error  = data.error || 'Nieznany błąd';
                    this.preQueueStatus = {...this.preQueueStatus, [item.clip.name]: 'error'};
                    await this._preRunNext();
                } else if (data.status === 'idle') {
                    clearInterval(this._prePolling);
                    item.status = 'error';
                    item.error  = 'Job zakończony bez statusu';
                    this.preQueueStatus = {...this.preQueueStatus, [item.clip.name]: 'error'};
                    await this._preRunNext();
                }
            } catch(e) { /* ignore transient network error */ }
        },

        // ─ Flow editor ────────────────────────────────────
        editMode: false,
        editModal: { open: false, kind: '', title: '', subtitle: '', data: {}, idx: null, saving: false, error: null, projectFiles: [], loadingFiles: false },
        addItemModal: { open: false, afterIdx: -1 },
        preflightModal: { open: false, conflicts: [], onConfirm: null },

        editOpenItem(idx) {
            const item = this.flowData?.flow?.[idx];
            if (!item || item.break) return;
            const kind = item.chain !== undefined ? 'chain' : (item.header !== undefined ? 'header' : 'file');
            const titles   = { chain: '⛓ Edytuj Chain', header: '📌 Edytuj nagłówek', file: '📄 Edytuj plik' };
            const subtitles = { chain: item.chain_prefix || 'chain', header: item.header || '', file: item.file || '' };
            this.editModal = {
                open: true,
                kind,
                title: titles[kind],
                subtitle: subtitles[kind],
                idx,
                saving: false,
                error: null,
                data: JSON.parse(JSON.stringify(item)),
                projectFiles: [],
                loadingFiles: false,
            };
            if (kind === 'file' && this.selectedRun?.filename) {
                this.editModal.loadingFiles = true;
                fetch(`/api/runs/${encodeURIComponent(this.selectedRun.filename)}/project-files`)
                    .then(r => r.ok ? r.json() : Promise.reject(r.status))
                    .then(data => { this.editModal.projectFiles = data.files || []; })
                    .catch(() => { /* silent — manual typing still works */ })
                    .finally(() => { this.editModal.loadingFiles = false; });
            }
        },

        async editModalSave() {
            this.editModal.saving = true;
            this.editModal.error = null;
            const d = this.editModal.data;
            // Remove empty optional numerics
            const optionals = ['fps', 'steps', 'cfg', 'blocks_to_swap', 'width', 'height'];
            for (const k of optionals) {
                if (d[k] === '' || d[k] === null || d[k] === undefined) delete d[k];
            }
            if (Array.isArray(d.chain)) {
                for (const step of d.chain) {
                    for (const k of optionals) {
                        if (step[k] === '' || step[k] === null || step[k] === undefined) delete step[k];
                    }
                }
            }
            // Warstwa 1: walidacja unikalności chain_prefix
            if (this.editModal.kind === 'chain' && d.chain_prefix) {
                const isDup = this.flowData.flow.some((item, i) =>
                    i !== this.editModal.idx && item.chain !== undefined && item.chain_prefix === d.chain_prefix
                );
                if (isDup) {
                    this.editModal.error = `Nazwa "${d.chain_prefix}" jest już używana przez inny chain — wybierz inną.`;
                    this.editModal.saving = false;
                    return;
                }
            }
            const newFlow = JSON.parse(JSON.stringify(this.flowData.flow));
            newFlow[this.editModal.idx] = d;
            const ok = await this._saveFlow(newFlow);
            if (ok) {
                this.flowData.flow = newFlow;
                this.frameVersion = Date.now();   // bust thumbnail cache → re-fetch after file rename
                this.editModal.open = false;
                this.logLine('sys', `✅ Zapisano zmiany w elemencie #${this.editModal.idx + 1}`);
                this.statusData = null; await this.refreshStatus();
            }
            this.editModal.saving = false;
        },

        async editMoveItem(idx, dir) {
            const flow = this.flowData?.flow;
            if (!flow) return;
            const ni = idx + dir;
            if (ni < 0 || ni >= flow.length) return;
            const newFlow = JSON.parse(JSON.stringify(flow));
            [newFlow[idx], newFlow[ni]] = [newFlow[ni], newFlow[idx]];
            const ok = await this._saveFlow(newFlow);
            if (ok) {
                this.flowData.flow = newFlow;
                this.statusData = null; await this.refreshStatus();
            }
        },

        async editDeleteItem(idx) {
            const item = this.flowData?.flow?.[idx];
            if (!item) return;
            const label = item.break ? 'break' : item.header !== undefined ? `nagłówek "${item.header}"` : item.chain_prefix ? `chain "${item.chain_prefix}"` : `plik "${item.file}"`;
            if (!confirm(`Usunąć: ${label}?\n\nTa operacja usuwa go z FLOW (pliki wideo na dysku zostają).`)) return;
            const newFlow = JSON.parse(JSON.stringify(this.flowData.flow));
            newFlow.splice(idx, 1);
            const ok = await this._saveFlow(newFlow);
            if (ok) {
                this.flowData.flow = newFlow;
                this.flowData.item_count = newFlow.length;
                this.statusData = null; await this.refreshStatus();
                this.logLine('sys', `🗑 Usunięto element #${idx + 1}: ${label}`);
            }
        },

        // ─ Chain prefix helpers ────────────────────────────
        nextChainPrefix() {
            const existing = new Set(
                (this.flowData?.flow || [])
                    .filter(i => i.chain !== undefined)
                    .map(i => i.chain_prefix || '')
            );
            let n = 1;
            while (existing.has(`nowy_chain_${n}`)) n++;
            return `nowy_chain_${n}`;
        },

        isChainPrefixDuplicate(prefix) {
            if (!prefix || !this.flowData?.flow) return false;
            return this.flowData.flow.filter(i => i.chain !== undefined && i.chain_prefix === prefix).length > 1;
        },

        // ─ Pre-flight conflict check ───────────────────────
        _getFlowConflicts() {
            const flow = this.flowData?.flow || [];
            const conflicts = [];
            // 1. Duplicate chain prefixes
            const prefixCounts = {};
            for (const item of flow) {
                if (item.chain !== undefined) {
                    const p = item.chain_prefix || '(bez nazwy)';
                    prefixCounts[p] = (prefixCounts[p] || 0) + 1;
                }
            }
            for (const [prefix, count] of Object.entries(prefixCounts)) {
                if (count > 1)
                    conflicts.push(`Duplikat nazwy chain: "${prefix}" (${count}×) — pliki wideo będą się nadpisywać`);
            }
            // 2. Duplicate start-frame files
            const fileCounts = {};
            for (const item of flow) {
                if (item.file) fileCounts[item.file] = (fileCounts[item.file] || 0) + 1;
            }
            for (const [file, count] of Object.entries(fileCounts)) {
                if (count > 1)
                    conflicts.push(`Plik "${file}" pojawia się ${count}× jako klatka — możliwa kolizja nazw tranzycji`);
            }
            return conflicts;
        },

        openAddItemModal(afterIdx) {
            this.addItemModal = { open: true, afterIdx };
        },

        async addItemDo(kind) {
            const afterIdx = this.addItemModal.afterIdx;
            this.addItemModal.open = false;
            let newItem;
            if (kind === 'break') {
                newItem = { break: true };
            } else if (kind === 'header') {
                newItem = { header: 'Nowa sekcja' };
            } else if (kind === 'file') {
                newItem = { file: 'nowy_plik.png', backend: 'linux', duration: 2, pos: 'NONE', neg: 'NONE' };
            } else {
                newItem = {
                    chain_prefix: this.nextChainPrefix(),
                    chain: [{ duration: 3, pos: 'NONE', neg: '' }],
                    backend: 'linux', fps: 16, steps: 6, cfg: 2.0,
                    neg: 'static, frozen, no movement',
                };
            }
            const newFlow = JSON.parse(JSON.stringify(this.flowData.flow));
            const insertAt = afterIdx < 0 ? 0 : afterIdx + 1;
            newFlow.splice(insertAt, 0, newItem);
            const ok = await this._saveFlow(newFlow);
            if (ok) {
                this.flowData.flow = newFlow;
                this.flowData.item_count = newFlow.length;
                this.statusData = null; await this.refreshStatus();
                this.logLine('sys', `➕ Dodano ${kind} na pozycji #${insertAt + 1}`);
                if (kind !== 'break') {
                    this.$nextTick(() => this.editOpenItem(insertAt));
                }
            }
        },

        editAddChainStep() {
            if (!this.editModal.data.chain) this.editModal.data.chain = [];
            this.editModal.data.chain.push({ duration: 3, pos: 'NONE', neg: '' });
        },
        editRemoveChainStep(si) {
            if (!confirm(`Usunąć step ${si + 1}?`)) return;
            this.editModal.data.chain.splice(si, 1);
        },
        editMoveChainStep(si, dir) {
            const steps = this.editModal.data.chain;
            const ni = si + dir;
            if (ni < 0 || ni >= steps.length) return;
            [steps[si], steps[ni]] = [steps[ni], steps[si]];
        },

        async _saveFlow(newFlow) {
            if (!this.selectedRun?.filename?.endsWith('.yaml')) {
                this.logLine('sys', '❌ Edycja FLOW działa tylko dla plików YAML');
                return false;
            }
            const flowKey = this.flowData?.flow_type === 'test' ? 'flow_test' : 'flow';
            try {
                const res = await fetch(
                    `/api/runs/${encodeURIComponent(this.selectedRun.filename)}/flow`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ flow: newFlow, flow_key: flowKey }),
                    }
                );
                const data = await res.json();
                if (!res.ok) {
                    const msg = data.detail || `HTTP ${res.status}`;
                    this.logLine('sys', `❌ Błąd zapisu FLOW: ${msg}`);
                    if (this.editModal.open) this.editModal.error = msg;
                    return false;
                }
                if (data.py_error) this.logLine('sys', `⚠ .py: ${data.py_error}`);
                return true;
            } catch(e) {
                this.logLine('sys', `❌ ${e.message}`);
                if (this.editModal.open) this.editModal.error = e.message;
                return false;
            }
        },

        // ─ Global settings modal ──────────────────────────
        globalsModal: {
            open: false, filename: '', loading: false, saving: false,
            error: null, saved: false,
            _resW: null, _resH: null,
            data: { project_folder: '', use_test_flow: false, defaults: {}, linux_backend: {} },
        },

        async openGlobalsModal(filename) {
            this.globalsModal = {
                open: true, filename, loading: true, saving: false,
                error: null, saved: false, _resW: null, _resH: null,
                data: { project_folder: '', use_test_flow: false, defaults: {}, linux_backend: {} },
            };
            try {
                const res = await fetch(`/api/runs/${encodeURIComponent(filename)}/globals`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                // Extract resolution into separate width/height fields
                const res2 = data.defaults?.resolution;
                const resW = Array.isArray(res2) && res2.length === 2 ? res2[0] : null;
                const resH = Array.isArray(res2) && res2.length === 2 ? res2[1] : null;
                // Remove resolution from defaults (we handle it separately)
                const defaults = { ...data.defaults };
                delete defaults.resolution;
                this.globalsModal = {
                    ...this.globalsModal,
                    loading: false,
                    _resW: resW,
                    _resH: resH,
                    data: {
                        project_folder:  data.project_folder || '',
                        use_test_flow:   data.use_test_flow || false,
                        defaults:        defaults,
                        linux_backend:   data.linux_backend || {},
                    },
                };
            } catch(e) {
                this.globalsModal.loading = false;
                this.globalsModal.error = e.message;
            }
        },

        async globalsModalSave() {
            this.globalsModal.saving = true;
            this.globalsModal.error = null;
            this.globalsModal.saved = false;

            // Assemble payload — clean up empty optionals
            const d = this.globalsModal.data;
            const defaults = { ...d.defaults };
            // Prune null/undefined/empty optional numerics
            for (const k of ['fps', 'steps', 'cfg', 'duration', 'blocks_to_swap']) {
                if (defaults[k] === '' || defaults[k] === null || defaults[k] === undefined) delete defaults[k];
            }
            // Re-attach resolution if both width and height are set
            const w = this.globalsModal._resW;
            const h = this.globalsModal._resH;
            if (w && h) defaults.resolution = [w, h];
            else delete defaults.resolution;

            const payload = {
                project_folder: d.project_folder,
                use_test_flow:  d.use_test_flow,
                defaults,
                linux_backend:  d.linux_backend || {},
            };

            try {
                const res = await fetch(
                    `/api/runs/${encodeURIComponent(this.globalsModal.filename)}/globals`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    }
                );
                const data = await res.json();
                if (!res.ok) {
                    this.globalsModal.error = data.detail || `HTTP ${res.status}`;
                } else {
                    this.globalsModal.saved = true;
                    if (data.py_error) this.logLine('sys', `⚠ .py: ${data.py_error}`);
                    this.logLine('sys', `✅ Ustawienia globalne zapisane: ${this.globalsModal.filename}`);
                    // Reload run info so the info bar updates
                    await this.loadRuns();
                    const updated = this.runs.find(r => r.filename === this.globalsModal.filename);
                    if (updated) this.selectedRun = updated;
                }
            } catch(e) {
                this.globalsModal.error = e.message;
            } finally {
                this.globalsModal.saving = false;
            }
        },

        // ─ Log panel ──────────────────────────────────────
        logLine(stream, text) {
            const out = document.getElementById('log-output');
            if (!out) return;
            const cls = { sys:'log-sys', stdout:'log-stdout', stderr:'log-stderr' }[stream] || 'log-stdout';
            const time = new Date().toLocaleTimeString('pl-PL');
            const line = document.createElement('div');
            line.innerHTML = `<span class="log-ts">[${time}]</span> <span class="${cls}">${this._esc(text)}</span>`;
            out.appendChild(line);
            while (out.children.length > 500) out.removeChild(out.firstChild);
            out.scrollTop = out.scrollHeight;
        },
        clearLog() { const o = document.getElementById('log-output'); if (o) o.innerHTML = ''; },
        _esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        },
        statusLabel() {
            return { idle:'oczekuje', running:'● generowanie', finished:'✅ zakończono', failed:'❌ błąd', stopped:'⏹ zatrzymano' }[this.genStatus] ?? this.genStatus;
        },

        // ─ YAML migration / generation ───────────────────
        async migrateToYaml(filename) {
            if (!filename.endsWith('.py')) return;
            if (!confirm(`Migrować ${filename} do formatu YAML?\n\nPowstanie plik ${filename.replace('.py','.yaml')} — oryginał .py zostaje bez zmian.`)) return;
            this.logLine('sys', `📄 Migruję ${filename} → YAML...`);
            try {
                const res = await fetch(`/api/runs/${encodeURIComponent(filename)}/migrate-to-yaml`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) { this.logLine('sys', `❌ Błąd migracji: ${data.detail}`); return; }
                this.logLine('sys', `✅ Plik YAML zapisany: ${data.yaml_filename}`);
                await this.loadRuns();
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },
        async generatePy(filename) {
            if (!filename.endsWith('.yaml') || this._genPyBusy) return;
            const pyName = filename.replace('.yaml', '.py');
            this._genPyBusy = true;
            this.logLine('sys', `⟳ Generuję ${pyName} z ${filename}...`);
            try {
                const res = await fetch(`/api/runs/${encodeURIComponent(filename)}/generate-py`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) { this.logLine('sys', `❌ Błąd generowania: ${data.detail}`); return; }
                this.logLine('sys', `✅ Plik .py wygenerowany: ${data.py_filename}`);
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
            finally { this._genPyBusy = false; }
        },

        async reformatYaml(filename) {
            if (!filename.endsWith('.yaml') || this._reformatBusy) return;
            this._reformatBusy = true;
            this.logLine('sys', `⟳ Reformatuję ${filename}...`);
            try {
                const res = await fetch(`/api/runs/${encodeURIComponent(filename)}/reformat-yaml`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) { this.logLine('sys', `❌ Błąd: ${data.detail}`); return; }
                this.logLine('sys', `✅ YAML przepisany w nowym formacie: ${filename}`);
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
            finally { this._reformatBusy = false; }
        },

        async viewSource(filename) {
            try {
                const res = await fetch(`/api/runs/${encodeURIComponent(filename)}/source`);
                if (!res.ok) return;
                const data = await res.json();
                this.sourceModal = { open: true, filename: data.filename, content: data.content };
            } catch(e) { this.logLine('sys', `❌ ${e.message}`); }
        },

        // ─ Display helpers ────────────────────────────────
        compatibilityIcon(c)  { return { current:'✅', yaml:'📄', legacy:'⚠️', unknown:'❓' }[c] ?? '❓'; },
        compatibilityTitle(c) { return { current:'Aktualny', yaml:'YAML', legacy:'Stary format', unknown:'Nieznany' }[c] ?? ''; },
        formatRes(r) {
            if (!r) return '—';
            if (Array.isArray(r) && r.length === 2) return `${r[0]}×${r[1]}`;
            return String(r);
        },
        projectFolderName() {
            const p = this.selectedRun?.project_folder;
            if (!p) return '—';
            return p.replace(/\\/g,'/').split('/').filter(Boolean).pop() || p;
        },
        fileIcon(f) {
            if (!f) return '📄';
            const ext = (f.split('.').pop() || '').toLowerCase();
            if (['jpg','jpeg','png','webp','gif','bmp'].includes(ext)) return '📷';
            if (['mp4','avi','mov','mkv','webm'].includes(ext)) return '🎬';
            return '📄';
        },
    };
}
</script>
