<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Video Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        .log-sys    { color: #fbbf24; }
        .log-stdout { color: #d1d5db; }
        .log-stderr { color: #f87171; }
        .log-ts     { color: #374151; }
        @keyframes pulse-green {
            0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.4); }
            50%      { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
        }
        .btn-running { animation: pulse-green 1.5s ease-in-out infinite; }
        /* Thumbnail */
        .thumb { width:56px; height:42px; object-fit:cover; border-radius:4px; flex-shrink:0; background:#1f2937; cursor:pointer; }
        .thumb-placeholder { width:56px; height:42px; border-radius:4px; flex-shrink:0; background:#1f2937; display:flex; align-items:center; justify-content:center; font-size:18px; }
        /* Status border colours — !important overrides Tailwind's border shorthand */
        .sl-green { border-left: 4px solid #15803d !important; }
        .sl-red   { border-left: 4px solid #b91c1c !important; }
        .sl-gray  { border-left: 4px solid #374151 !important; }
        /* Log resize handle */
        .log-resize-handle { height:6px; cursor:ns-resize; background:#111827; border-top:1px solid #1f2937; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .log-resize-handle:hover { background:#1f2937; }
        .log-resize-handle span { display:block; width:40px; height:2px; border-radius:9999px; background:#374151; pointer-events:none; }
        /* Add-zone between flow items (edit mode) */
        .add-zone { display:none; }
        .add-zone.active { display:flex; }
    </style>
</head>

<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden" x-data="app()">

<!-- ═══ TOP BAR ═══════════════════════════════════════════════════ -->
<header class="bg-gray-800 border-b border-gray-700 px-5 py-3 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-3">
        <span class="text-2xl">🎬</span>
        <div>
            <h1 class="font-bold text-base leading-tight">ComfyUI Video Generator</h1>
            <p class="text-xs text-gray-500 leading-tight">v0.7 — Etap 7</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <span :title="wsConnected ? 'WebSocket OK' : 'WebSocket rozłączony'"
              :class="wsConnected ? 'bg-green-500' : 'bg-red-600'"
              class="w-2 h-2 rounded-full flex-shrink-0 transition-colors"></span>
        <a :href="comfyuiUrl" target="_blank"
           class="flex items-center gap-2 bg-purple-700 hover:bg-purple-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">
            ⚡ Open ComfyUI
        </a>
        <div class="h-5 w-px bg-gray-600"></div>
        <a href="/logout" class="text-gray-400 hover:text-white text-sm transition px-2 py-1 rounded hover:bg-gray-700">Wyloguj ↩</a>
    </div>
</header>

<!-- ═══ COMBINED NAV BAR: PROJEKTY + project info ══════════════════ -->
<div class="flex items-stretch border-b border-gray-700 bg-gray-800 flex-shrink-0 text-xs text-gray-400">

    <!-- PROJEKTY label — same width as sidebar -->
    <div class="w-52 flex items-center justify-between px-4 py-3 border-r border-gray-700 flex-shrink-0">
        <span class="uppercase font-semibold tracking-wider">Projekty</span>
        <button @click="loadRuns()" class="text-gray-500 hover:text-gray-300 transition text-sm" title="Odśwież">↻</button>
    </div>

    <!-- Project info content (flex-1) -->
    <div class="flex flex-1 items-stretch min-w-0 overflow-hidden">

        <!-- Placeholder: no project selected or incompatible -->
        <template x-if="!selectedRun || !((selectedRun.compatibility === 'current' || selectedRun.compatibility === 'yaml') && !selectedRun.syntax_error)">
            <div class="flex items-center px-5 flex-1 text-gray-700 select-none">— wybierz projekt —</div>
        </template>

        <!-- Info area: yaml (clickable) -->
        <template x-if="selectedRun && selectedRun.compatibility === 'yaml' && !selectedRun.syntax_error">
            <button @click="openGlobalsModal(selectedRun.filename)"
                    class="flex items-center gap-x-4 px-5 flex-1 text-left group transition cursor-pointer min-w-0 overflow-hidden"
                    style="background:transparent"
                    title="Kliknij aby edytować ustawienia projektu">
                <span class="text-orange-400 font-semibold group-hover:text-orange-300 transition flex-shrink-0">⚙</span>
                <span class="flex items-center gap-1 flex-shrink-0">📁 <span class="text-gray-300 group-hover:text-white transition" x-text="projectFolderName()"></span></span>
                <span class="flex items-center gap-1 flex-shrink-0">📐 <span class="text-gray-300 font-mono" x-text="formatRes(selectedRun.force_resolution)"></span></span>
                <span class="flex items-center gap-1 flex-shrink-0">⚙️ <span class="text-gray-300" x-text="selectedRun.default_backend || '—'"></span></span>
                <span x-show="selectedRun.default_fps" class="flex items-center gap-1 flex-shrink-0">🎞 <span class="text-gray-300" x-text="selectedRun.default_fps + ' fps'"></span></span>
                <span x-show="selectedRun.default_steps" class="flex items-center gap-1 flex-shrink-0">🪜 <span class="text-gray-300" x-text="selectedRun.default_steps + ' steps'"></span></span>
                <span x-show="selectedRun.default_blocks_to_swap != null" class="flex items-center gap-1 flex-shrink-0">🔲 <span class="text-gray-300" x-text="'bts:' + selectedRun.default_blocks_to_swap"></span></span>
                <span class="text-gray-600 group-hover:text-orange-500 transition ml-1 flex-shrink-0">✎ edytuj</span>
            </button>
        </template>

        <!-- Info area: non-yaml (plain) -->
        <template x-if="selectedRun && selectedRun.compatibility === 'current' && !selectedRun.syntax_error">
            <div class="flex items-center gap-x-5 px-5 flex-1 min-w-0 overflow-hidden">
                <span class="flex items-center gap-1 flex-shrink-0">📁 <span class="text-gray-300" x-text="projectFolderName()"></span></span>
                <span class="flex-shrink-0">📐 <span class="text-gray-300 font-mono" x-text="formatRes(selectedRun.force_resolution)"></span></span>
                <span class="flex-shrink-0">⚙️ <span class="text-gray-300" x-text="selectedRun.default_backend || '—'"></span></span>
                <span x-show="selectedRun.default_fps" class="flex-shrink-0">🎞 <span class="text-gray-300" x-text="selectedRun.default_fps + ' fps'"></span></span>
                <span x-show="selectedRun.default_steps" class="flex-shrink-0">🪜 <span class="text-gray-300" x-text="selectedRun.default_steps + ' steps'"></span></span>
                <span x-show="selectedRun.default_blocks_to_swap != null" class="flex-shrink-0">🔲 <span class="text-gray-300" x-text="'bts:' + selectedRun.default_blocks_to_swap"></span></span>
            </div>
        </template>

        <!-- Flow / Post tabs — only when run is active -->
        <template x-if="selectedRun && (selectedRun.compatibility === 'current' || selectedRun.compatibility === 'yaml') && !selectedRun.syntax_error">
            <div class="flex items-center border-l border-gray-700 px-2 gap-0.5 flex-shrink-0">
                <button @click="preMode=true; postMode=false; editMode=false; loadPreClips()"
                        :class="preMode ? 'bg-purple-900 text-purple-200' : 'text-gray-500 hover:text-gray-300 hover:bg-gray-700/50'"
                        class="text-xs px-2.5 py-1 rounded-l transition"
                        title="Pre-processing (hurtowy upscale)">🔧 Pre</button>
                <button @click="preMode=false; postMode=false; editMode=false"
                        :class="!preMode && !postMode ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-gray-300 hover:bg-gray-700/50'"
                        class="text-xs px-2.5 py-1 transition"
                        title="Widok FLOW">📋 Flow</button>
                <button @click="preMode=false; postMode=true; editMode=false; loadPostClips()"
                        :class="postMode ? 'bg-blue-900 text-blue-200' : 'text-gray-500 hover:text-gray-300 hover:bg-gray-700/50'"
                        class="text-xs px-2.5 py-1 rounded-r transition"
                        title="Post-processing">🎬 Post</button>
            </div>
        </template>

        <!-- Right side actions — only when run is active -->
        <template x-if="selectedRun && (selectedRun.compatibility === 'current' || selectedRun.compatibility === 'yaml') && !selectedRun.syntax_error">
            <div class="flex items-center gap-2 px-3 border-l border-gray-700 flex-shrink-0">
                <template x-if="selectedRun.compatibility === 'yaml'">
                    <span class="flex items-center gap-2">
                        <button @click="viewSource(selectedRun.filename)"
                                class="bg-indigo-900 hover:bg-indigo-800 text-indigo-300 px-2 py-0.5 rounded text-xs font-medium cursor-pointer transition"
                                title="Podgląd pliku YAML">📄 YAML</button>
                        <button @click="reformatYaml(selectedRun.filename)"
                                :disabled="_reformatBusy"
                                :class="_reformatBusy ? 'opacity-40 cursor-not-allowed' : 'hover:bg-indigo-900/40 cursor-pointer'"
                                class="flex items-center gap-1 text-indigo-400 border border-indigo-700 hover:border-indigo-400 transition px-2 py-0.5 rounded text-xs"
                                title="Przepisz YAML w nowym czytelnym formacie">
                            <span :class="_reformatBusy ? 'animate-spin inline-block' : ''">⟳</span>
                            <span>YAML</span>
                        </button>
                        <button @click="generatePy(selectedRun.filename)"
                                :disabled="_genPyBusy"
                                :class="_genPyBusy ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-700 cursor-pointer'"
                                class="flex items-center gap-1 text-gray-300 border border-gray-600 hover:border-gray-400 transition px-2 py-0.5 rounded text-xs"
                                title="Wygeneruj ponownie plik .py z YAML">
                            <span :class="_genPyBusy ? 'animate-spin inline-block' : ''">⟳</span>
                            <span>.py</span>
                        </button>
                    </span>
                </template>
                <template x-if="selectedRun.compatibility === 'current'">
                    <span class="flex items-center gap-2">
                        <button @click="viewSource(selectedRun.filename)"
                                class="text-gray-500 hover:text-gray-300 border border-gray-700 hover:border-gray-500 transition px-2 py-0.5 rounded text-xs cursor-pointer"
                                title="Podgląd pliku .py">📄 .py</button>
                        <button @click="migrateToYaml(selectedRun.filename)"
                                class="text-indigo-400 hover:text-indigo-200 border border-indigo-700 hover:border-indigo-400 hover:bg-indigo-900/30 transition px-2 py-0.5 rounded text-xs cursor-pointer"
                                title="Migruj do formatu YAML">→ YAML</button>
                    </span>
                </template>
            </div>
        </template>

    </div><!-- /project info content -->
</div><!-- /combined nav bar -->

<!-- ═══ MAIN ══════════════════════════════════════════════════════ -->
<div class="flex flex-1 overflow-hidden">

    <!-- ─── SIDEBAR ───────────────────────────────────────────── -->
    <aside class="w-52 bg-gray-800 border-r border-gray-700 flex flex-col flex-shrink-0">
        <div x-show="runsLoading" class="flex items-center justify-center py-8 text-gray-600 text-sm gap-2">
            <span class="animate-spin inline-block">⟳</span> Ładowanie...
        </div>
        <div x-show="runsError && !runsLoading" class="px-4 py-3 text-red-400 text-xs">❌ <span x-text="runsError"></span></div>
        <div x-show="!runsLoading" class="flex-1 overflow-y-auto py-1">
            <template x-if="runs.length === 0 && !runsError">
                <div class="flex flex-col items-center justify-center py-8 text-center px-4 gap-2">
                    <span class="text-3xl opacity-30">📁</span>
                    <p class="text-xs text-gray-600">Brak plików RUN_*.py</p>
                </div>
            </template>
            <template x-for="run in runs" :key="run.filename">
                <button @click="selectRun(run)"
                        class="w-full text-left px-3 py-2.5 hover:bg-gray-700 transition flex items-start gap-2"
                        :class="selectedRun?.filename === run.filename ? 'bg-gray-700 border-l-2 border-blue-500' : 'border-l-2 border-transparent'">
                    <span class="mt-0.5 flex-shrink-0 text-xs" :title="compatibilityTitle(run.compatibility)"
                          x-text="compatibilityIcon(run.compatibility)"></span>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm text-gray-200 truncate leading-snug" x-text="run.display_name"></p>
                        <p class="text-xs text-gray-600 truncate mt-0.5" x-text="run.filename"></p>
                    </div>
                </button>
            </template>
        </div>
        <div class="px-4 py-2 border-t border-gray-700 text-xs text-gray-600">✅ aktualny &nbsp; 📄 yaml &nbsp; ⚠️ stary &nbsp; ❓ nieznany</div>
    </aside>

    <!-- ─── CONTENT ────────────────────────────────────────────── -->
    <main class="flex-1 flex flex-col overflow-hidden">

        <!-- TOOLBAR — hidden in post/pre-processing mode -->
        <div x-show="selectedRun && !postMode && !preMode" class="border-b border-gray-700 px-5 py-2 flex items-center gap-3 flex-shrink-0 bg-gray-900">
            <!-- Generuj -->
            <button @click="startGeneration()"
                    :disabled="!canGenerate"
                    :class="[canGenerate && !isRunning ? 'bg-green-700 hover:bg-green-600 cursor-pointer'
                             : isRunning ? 'bg-green-800 cursor-not-allowed btn-running'
                             : 'bg-gray-700 opacity-40 cursor-not-allowed']"
                    class="text-white text-sm font-medium px-4 py-1.5 rounded-lg transition flex items-center gap-2">
                <span x-text="isRunning ? '⟳' : '▶'" :class="isRunning ? 'animate-spin inline-block' : ''"></span>
                <span x-text="isRunning ? 'Generowanie...' : 'Generuj'"></span>
            </button>
            <!-- Stop -->
            <button @click="stopGeneration()" :disabled="!isRunning"
                    :class="isRunning ? 'bg-red-700 hover:bg-red-600 cursor-pointer' : 'bg-gray-700 opacity-40 cursor-not-allowed'"
                    class="text-white text-sm px-3 py-1.5 rounded-lg transition">⏹ Stop</button>
            <!-- Dry-run -->
            <button @click="dryRun()"
                    :disabled="!canGenerate || isRunning"
                    :class="canGenerate && !isRunning ? 'bg-gray-700 hover:bg-gray-600 cursor-pointer' : 'bg-gray-800 opacity-40 cursor-not-allowed'"
                    class="text-white text-sm px-3 py-1.5 rounded-lg transition" title="Sprawdź status generacji i odśwież wszystkie miniatury">
                🔍 Sprawdź i odśwież
            </button>
            <!-- Refresh status -->
            <button @click="refreshStatus()"
                    :disabled="!selectedRun || isRunning"
                    :class="selectedRun && !isRunning ? 'text-gray-400 hover:text-white cursor-pointer' : 'text-gray-700 cursor-not-allowed'"
                    class="text-sm px-2 py-1.5 rounded transition" title="Odśwież status plików">↻ Status</button>

            <div class="h-4 w-px bg-gray-700"></div>
            <!-- Edit flow button — only for yaml runs -->
            <template x-if="selectedRun?.compatibility === 'yaml' && !isRunning">
                <button @click="editMode = !editMode"
                        :class="editMode
                            ? 'bg-yellow-700 hover:bg-yellow-600 text-white border-transparent'
                            : 'text-yellow-400 border border-yellow-700 hover:border-yellow-400 hover:bg-yellow-900/30'"
                        class="text-sm px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                    <span x-text="editMode ? '✏ Edycja ON' : '✏ Edytuj FLOW'"></span>
                </button>
            </template>
            <div class="h-4 w-px bg-gray-700"></div>
            <span class="text-xs" :class="isRunning ? 'text-green-400' : 'text-gray-500'" x-text="toolbarStatus"></span>

            <!-- FLOW badge + counters -->
            <template x-if="flowData">
                <div class="ml-auto flex items-center gap-3">
                    <template x-if="statusData">
                        <div class="flex items-center gap-2 text-xs">
                            <span class="text-green-400" x-text="'✅ ' + statusData.generated"></span>
                            <span class="text-gray-600">|</span>
                            <span :class="statusData.missing > 0 ? 'text-red-400' : 'text-gray-600'"
                                  x-text="'○ ' + statusData.missing"></span>
                        </div>
                    </template>
                    <span class="text-xs text-gray-500" x-text="`${flowData.item_count} elementów`"></span>
                    <span class="px-2 py-0.5 rounded text-xs font-medium"
                          :class="flowData.flow_type === 'test' ? 'bg-yellow-900 text-yellow-300' : 'bg-blue-900 text-blue-300'"
                          x-text="flowData.flow_type === 'test' ? '🧪 TEST FLOW' : '📽 FULL FLOW'"></span>
                </div>
            </template>
        </div>

        <!-- ─── MAIN SCROLL AREA ─── -->
        <div class="flex-1 overflow-y-auto">

            <!-- No run selected -->
            <template x-if="!selectedRun">
                <div class="flex items-center justify-center h-full">
                    <div class="text-center">
                        <div class="text-6xl mb-4 opacity-20">🎞</div>
                        <p class="text-gray-500">Wybierz projekt z listy po lewej</p>
                    </div>
                </div>
            </template>

            <!-- Legacy / unknown (not current and not yaml) -->
            <template x-if="selectedRun && selectedRun.compatibility !== 'current' && selectedRun.compatibility !== 'yaml'">
                <div class="p-6 max-w-xl">
                    <div class="flex items-center gap-3 mb-4">
                        <span x-text="compatibilityIcon(selectedRun.compatibility)" class="text-2xl"></span>
                        <div>
                            <h2 class="text-lg font-bold" x-text="selectedRun.display_name"></h2>
                            <p class="text-sm text-gray-500" x-text="selectedRun.filename"></p>
                        </div>
                    </div>
                    <div class="bg-yellow-900/30 border border-yellow-700 rounded-lg px-4 py-3 text-sm text-yellow-300">
                        ⚠️ Plik używa starego formatu i nie może być uruchomiony przez GUI.
                    </div>
                    <template x-if="selectedRun.filename.endsWith('.py')">
                        <button @click="migrateToYaml(selectedRun.filename)"
                                class="mt-4 bg-indigo-700 hover:bg-indigo-600 text-white text-sm px-4 py-2 rounded-lg transition">
                            📄 Migruj do YAML
                        </button>
                    </template>
                </div>
            </template>

            <!-- Syntax error -->
            <template x-if="selectedRun && (selectedRun.compatibility === 'current' || selectedRun.compatibility === 'yaml') && selectedRun.syntax_error">
                <div class="p-6">
                    <div class="bg-red-950 border border-red-700 rounded-lg p-4">
                        <p class="text-red-400 font-bold mb-2">❌ Błąd składni w pliku RUN</p>
                        <p class="text-red-300 text-sm font-mono mb-1"
                           x-text="`Linia ${selectedRun.syntax_error.line}: ${selectedRun.syntax_error.msg}`"></p>
                        <p class="text-gray-400 text-xs font-mono bg-gray-900 rounded px-3 py-2 mt-2"
                           x-text="selectedRun.syntax_error.text || ''"></p>
                    </div>
                </div>
            </template>

            <!-- Current run — FLOW view -->
            <template x-if="selectedRun && (selectedRun.compatibility === 'current' || selectedRun.compatibility === 'yaml') && !selectedRun.syntax_error && !postMode && !preMode">
                <div class="p-4 space-y-2">
                        <template x-if="flowLoading">
                            <div class="flex items-center gap-2 text-gray-500 text-sm py-4">
                                <span class="animate-spin">⟳</span> Ładowanie FLOW...
                            </div>
                        </template>
                        <template x-if="flowError && !flowLoading">
                            <div class="text-red-400 text-sm py-4">❌ <span x-text="flowError"></span></div>
                        </template>

                        <template x-if="flowData && !flowLoading">
                            <div class="space-y-2">
                                <!-- Add-zone at the very start -->
                                <div :class="editMode ? 'add-zone active' : 'add-zone'"
                                     @click="openAddItemModal(-1)"
                                     class="w-full items-center justify-center gap-2 py-1 mb-1 text-xs font-medium text-blue-400 bg-blue-950/40 border border-dashed border-blue-800 rounded hover:bg-blue-900/50 hover:border-blue-500 hover:text-blue-300 transition cursor-pointer">
                                    <span>+</span><span>wstaw element</span>
                                </div>

                        <template x-for="(item, idx) in flowData.flow" :key="idx">
                                    <div>

                                        <!-- BREAK -->
                                        <template x-if="item.break">
                                            <div class="flex items-center gap-3 py-1">
                                                <div class="flex-1 border-t border-dashed border-gray-700"></div>
                                                <span class="text-xs text-gray-600 flex-shrink-0">✂ break</span>
                                                <div class="flex-1 border-t border-dashed border-gray-700"></div>
                                                <!-- Edit mode: break controls -->
                                                <template x-if="editMode">
                                                    <div class="flex items-center gap-1 flex-shrink-0">
                                                        <button @click="editMoveItem(idx, -1)" :disabled="idx === 0"
                                                                :class="idx === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:text-white'"
                                                                class="text-gray-600 text-xs px-1 py-0.5 rounded hover:bg-gray-700">↑</button>
                                                        <button @click="editMoveItem(idx, 1)" :disabled="idx === flowData.flow.length - 1"
                                                                :class="idx === flowData.flow.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:text-white'"
                                                                class="text-gray-600 text-xs px-1 py-0.5 rounded hover:bg-gray-700">↓</button>
                                                        <button @click="editDeleteItem(idx)"
                                                                class="text-gray-700 hover:text-red-400 text-xs px-1 py-0.5 rounded hover:bg-gray-800 transition">✕</button>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- HEADER -->
                                        <template x-if="item.header !== undefined && !item.break">
                                            <div class="flex items-center gap-3 py-1.5 px-3 rounded-lg"
                                                 style="background:linear-gradient(90deg,#1e1b4b 0%,#2e1065 50%,#1e1b4b 100%);border:1px solid #4c1d95">
                                                <div class="flex-1 flex items-center justify-center gap-3 min-w-0">
                                                    <div class="h-px flex-1 opacity-40" style="background:linear-gradient(90deg,transparent,#a78bfa)"></div>
                                                    <span class="text-xs font-semibold tracking-widest text-violet-300 uppercase flex-shrink-0" x-text="item.header"></span>
                                                    <div class="h-px flex-1 opacity-40" style="background:linear-gradient(90deg,#a78bfa,transparent)"></div>
                                                </div>
                                                <!-- Edit mode controls -->
                                                <template x-if="editMode">
                                                    <div class="flex items-center gap-1 flex-shrink-0">
                                                        <button @click="editOpenItem(idx)"
                                                                class="text-violet-400 hover:text-violet-200 text-xs px-1.5 py-0.5 rounded hover:bg-violet-900/40 transition" title="Edytuj nagłówek">✎</button>
                                                        <button @click="editMoveItem(idx, -1)" :disabled="idx === 0"
                                                                :class="idx === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:text-white'"
                                                                class="text-gray-600 text-xs px-1 py-0.5 rounded hover:bg-gray-700">↑</button>
                                                        <button @click="editMoveItem(idx, 1)" :disabled="idx === flowData.flow.length - 1"
                                                                :class="idx === flowData.flow.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:text-white'"
                                                                class="text-gray-600 text-xs px-1 py-0.5 rounded hover:bg-gray-700">↓</button>
                                                        <button @click="editDeleteItem(idx)"
                                                                class="text-gray-600 hover:text-red-400 text-xs px-1 py-0.5 rounded hover:bg-gray-800 transition">✕</button>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- CHAIN -->
                                        <template x-if="item.chain">
                                            <div class="bg-gray-800 border border-gray-600 rounded-lg overflow-hidden"
                                                 :class="chainBorderClass(idx)">
                                                <div class="px-4 py-2.5 border-b border-gray-700 flex flex-wrap items-center gap-2"
                                                     style="background-color:#1a2332"
                                                     :class="editMode ? 'cursor-pointer' : ''"
                                                     @click="if(editMode && !$event.target.closest('button,img,video,a,select,input')) editOpenItem(idx)">
                                                    <span class="text-sm">⛓</span>
                                                    <span class="font-mono text-sm text-blue-300" x-text="item.chain_prefix || 'chain'"></span>
                                                    <template x-if="isChainPrefixDuplicate(item.chain_prefix)">
                                                        <span class="px-1.5 py-0.5 bg-yellow-900/60 border border-yellow-700 rounded text-xs text-yellow-400 font-semibold">⚠ duplikat nazwy</span>
                                                    </template>
                                                    <div class="flex flex-wrap gap-1.5 ml-1">
                                                        <template x-if="item.backend"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-300" x-text="item.backend"></span></template>
                                                        <template x-if="item.fps"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-400" x-text="item.fps + ' fps'"></span></template>
                                                        <template x-if="item.steps"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-400" x-text="item.steps + ' steps'"></span></template>
                                                        <template x-if="item.cfg"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-400" x-text="'cfg ' + item.cfg"></span></template>
                                                        <template x-if="item.blocks_to_swap != null"><span class="px-1.5 py-0.5 bg-indigo-900 rounded text-xs text-indigo-300" x-text="'bts:' + item.blocks_to_swap"></span></template>
                                                        <template x-if="item.width && item.height"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-yellow-400" x-text="item.width + '×' + item.height"></span></template>
                                                    </div>
                                                    <!-- Chain status — each helper called ONCE -->
                                                    <div class="ml-auto flex items-center gap-2">
                                                        <template x-if="chainStatusOk(idx)">
                                                            <span :class="chainStatusClass(idx)" x-text="chainStatusLabel(idx)"></span>
                                                        </template>
                                                        <span class="text-xs text-gray-600" x-text="item.chain.length + ' step' + (item.chain.length !== 1 ? 's' : '')"></span>
                                                        <!-- Edit mode controls for chain -->
                                                        <template x-if="editMode">
                                                            <div class="flex items-center gap-1 border-l border-gray-700 pl-2 ml-1">
                                                                <button @click="editOpenItem(idx)"
                                                                        class="text-yellow-500 hover:text-yellow-300 text-xs px-1.5 py-0.5 rounded hover:bg-yellow-900/30 transition" title="Edytuj chain">✎</button>
                                                                <button @click="editMoveItem(idx, -1)" :disabled="idx === 0"
                                                                        :class="idx === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:text-white'"
                                                                        class="text-gray-600 text-xs px-1 py-0.5 rounded hover:bg-gray-700">↑</button>
                                                                <button @click="editMoveItem(idx, 1)" :disabled="idx === flowData.flow.length - 1"
                                                                        :class="idx === flowData.flow.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:text-white'"
                                                                        class="text-gray-600 text-xs px-1 py-0.5 rounded hover:bg-gray-700">↓</button>
                                                                <button @click="editDeleteItem(idx)"
                                                                        class="text-gray-600 hover:text-red-400 text-xs px-1 py-0.5 rounded hover:bg-gray-800 transition" title="Usuń chain">✕</button>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                                <div class="divide-y divide-gray-700">
                                                    <template x-for="(step, si) in item.chain" :key="si">
                                                        <div class="px-4 py-2.5 flex items-start gap-3">
                                                            <!-- Chain step thumbnail -->
                                                            <div class="flex-shrink-0 mt-0.5">
                                                                <template x-if="si === 0 && item.chain_prefix">
                                                                    <img :src="thumbUrl(item.chain_prefix + '_001.mp4', 'start')"
                                                                         class="thumb"
                                                                         @error="$el.style.display='none'"
                                                                         @click="openFrameModal(item.chain_prefix + '_001.mp4')"
                                                                         title="Kliknij aby powiększyć">
                                                                </template>
                                                                <template x-if="si > 0 || !item.chain_prefix">
                                                                    <div class="thumb-placeholder text-gray-700">⛓</div>
                                                                </template>
                                                            </div>
                                                            <div class="flex-1 min-w-0">
                                                                <div class="flex items-start gap-2">
                                                                    <span class="text-xs text-gray-600 mt-0.5 flex-shrink-0" x-text="'Step ' + (si+1)"></span>
                                                                    <div class="flex flex-wrap gap-1.5">
                                                                        <template x-if="step.duration"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-300" x-text="step.duration + 's'"></span></template>
                                                                        <template x-if="step.blocks_to_swap != null"><span class="px-1.5 py-0.5 bg-indigo-900 rounded text-xs text-indigo-300" x-text="'bts:' + step.blocks_to_swap"></span></template>
                                                                        <template x-if="step.width && step.height"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-yellow-400" x-text="step.width + '×' + step.height"></span></template>
                                                                    </div>
                                                                </div>
                                                                <!-- Pos prompt — green when active, gray when NONE -->
                                                                <template x-if="step.pos && step.pos !== 'NONE'">
                                                                    <p class="text-xs text-green-400/80 mt-1 line-clamp-2 leading-relaxed" x-text="step.pos"></p>
                                                                </template>
                                                                <template x-if="!step.pos || step.pos === 'NONE'">
                                                                    <p class="text-xs text-gray-600 mt-1">— brak prompta</p>
                                                                </template>
                                                                <!-- Neg prompt — collapsible, red -->
                                                                <template x-if="step.neg && step.neg !== 'NONE' && step.neg !== ''">
                                                                    <div class="mt-1" x-data="{ open: false }">
                                                                        <button @click="open = !open" class="text-xs text-gray-600 hover:text-gray-400 transition">
                                                                            <span x-text="open ? '▲ neg' : '▼ neg'"></span>
                                                                        </button>
                                                                        <p x-show="open" class="text-xs text-red-400/60 mt-0.5 leading-relaxed line-clamp-3" x-text="step.neg"></p>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                            <!-- Chain step video actions -->
                                                            <template x-if="item.chain_prefix">
                                                                <div class="flex-shrink-0 flex items-center gap-1" x-data="{ fname: (item.chain_prefix + '_' + String(si+1).padStart(3,'0') + '.mp4') }">
                                                                    <template x-if="itemExists(fname)">
                                                                        <div class="flex gap-1 items-center">
                                                                            <button @click="openVideoModal(fname)" class="text-green-500 hover:text-green-400 text-sm px-1" title="Odtwórz">▶</button>
                                                                            <button @click="regenChainFrom(item.chain_prefix, si, item.chain.length)"
                                                                                    :disabled="isRunning"
                                                                                    :class="isRunning ? 'opacity-30 cursor-not-allowed text-gray-600' : 'text-gray-500 hover:text-blue-400'"
                                                                                    class="text-sm px-1 transition"
                                                                                    :title="'Re-generuj od step '+(si+1)+' do '+item.chain.length">↺</button>
                                                                            <button @click="archiveChainFrom(item.chain_prefix, si, item.chain.length)"
                                                                                    class="text-gray-600 hover:text-red-400 text-sm px-1"
                                                                                    :title="'Archiwizuj od step '+(si+1)+' do '+item.chain.length">🗑</button>
                                                                            <template x-if="chainStepHasArchived(idx, si)">
                                                                                <button @click="openVersionsModal(fname)"
                                                                                        class="text-gray-500 hover:text-yellow-400 text-sm px-1 transition"
                                                                                        title="Pokaż wersje archiwalne">📂</button>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                    <template x-if="!itemExists(fname)">
                                                                        <div class="flex items-center gap-1">
                                                                            <span class="text-red-700 text-xs">○</span>
                                                                            <button @click="regenChainFrom(item.chain_prefix, si, item.chain.length)"
                                                                                    :disabled="isRunning"
                                                                                    :class="isRunning ? 'opacity-30 cursor-not-allowed text-gray-600' : 'text-red-600 hover:text-red-400'"
                                                                                    class="text-sm px-1 transition"
                                                                                    :title="'Generuj od step '+(si+1)+' do '+item.chain.length">↺</button>
                                                                            <template x-if="chainStepHasVersions(idx, si)">
                                                                                <button @click="openVersionsModal(fname)"
                                                                                        class="text-gray-500 hover:text-yellow-400 text-sm px-1 transition"
                                                                                        title="Pokaż wersje archiwalne">📂</button>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>

                                        <!-- FILE -->
                                        <template x-if="item.file">
                                            <div class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 hover:border-gray-600 transition"
                                                 :class="[fileItemBorderClass(idx), editMode ? 'cursor-pointer ring-1 ring-yellow-700/40' : '']"
                                                 @click="if(editMode && !$event.target.closest('button,img,video,a,select,input')) editOpenItem(idx)">
                                                <div class="flex items-start gap-3">
                                                    <!-- Thumbnail + upload button -->
                                                    <div class="flex-shrink-0 flex flex-col items-center gap-0.5">
                                                        <img :src="frameUrl(item.file, 'start')"
                                                             class="thumb"
                                                             @error="$el.style.display='none'; $el.nextElementSibling.style.display='flex'"
                                                             @load="$el.style.display=''; $el.nextElementSibling.style.display='none'"
                                                             @click="openFrameModal(item.file)"
                                                             title="Kliknij aby zobaczyć klatki">
                                                        <div class="thumb-placeholder text-gray-600" style="display:none"
                                                             x-text="fileIcon(item.file)"></div>
                                                        <button @click="openSourceUpload(item.file)"
                                                                class="text-gray-600 hover:text-blue-400 text-xs leading-none transition cursor-pointer"
                                                                title="Podmień plik źródłowy">⬆</button>
                                                    </div>

                                                    <div class="flex-1 min-w-0">
                                                        <!-- Header row -->
                                                        <div class="flex flex-wrap items-center gap-2">
                                                            <span class="font-mono text-sm text-gray-200 flex-shrink-0" x-text="item.file"></span>
                                                            <div class="flex flex-wrap gap-1.5">
                                                                <template x-if="item.backend"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-300" x-text="item.backend"></span></template>
                                                                <template x-if="item.duration"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-300" x-text="item.duration + 's'"></span></template>
                                                                <template x-if="item.fps"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-400" x-text="item.fps + ' fps'"></span></template>
                                                                <template x-if="item.steps"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-400" x-text="item.steps + ' steps'"></span></template>
                                                                <template x-if="item.cfg"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-gray-400" x-text="'cfg ' + item.cfg"></span></template>
                                                                <template x-if="item.blocks_to_swap != null"><span class="px-1.5 py-0.5 bg-indigo-900 rounded text-xs text-indigo-300" x-text="'bts:' + item.blocks_to_swap"></span></template>
                                                                <template x-if="item.width && item.height"><span class="px-1.5 py-0.5 bg-gray-700 rounded text-xs text-yellow-400" x-text="item.width + '×' + item.height"></span></template>
                                                            </div>
                                                        </div>
                                                        <!-- Positive prompt — green when active (generates transition), gray when last-before-break -->
                                                        <template x-if="item.pos && item.pos !== 'NONE'">
                                                            <p class="text-xs mt-2 line-clamp-2 leading-relaxed"
                                                               :class="_si(idx)?.status === 'gray' ? 'text-gray-600' : 'text-green-400/80'"
                                                               x-text="item.pos"></p>
                                                        </template>
                                                        <!-- Negative prompt -->
                                                        <template x-if="item.neg && item.neg !== 'NONE'">
                                                            <div class="mt-1">
                                                                <button @click="negOpen[idx] = !negOpen[idx]"
                                                                        class="text-xs transition"
                                                                        :class="_si(idx)?.status === 'gray' ? 'text-gray-700 hover:text-gray-500' : 'text-gray-600 hover:text-gray-400'">
                                                                    <span x-text="negOpen[idx] ? '▲ neg' : '▼ neg'"></span>
                                                                </button>
                                                                <p x-show="negOpen[idx]"
                                                                   class="text-xs mt-1 leading-relaxed line-clamp-4"
                                                                   :class="_si(idx)?.status === 'gray' ? 'text-gray-700' : 'text-red-400/60'"
                                                                   x-text="item.neg"></p>
                                                            </div>
                                                        </template>
                                                    </div>

                                                    <!-- Edit mode controls for file -->
                                                    <template x-if="editMode">
                                                        <div class="flex-shrink-0 flex flex-col items-center gap-1 ml-2 border-l border-yellow-900/50 pl-2">
                                                            <button @click="editOpenItem(idx)"
                                                                    class="text-yellow-500 hover:text-yellow-300 text-sm px-1 py-0.5 rounded hover:bg-yellow-900/30 transition" title="Edytuj">✎</button>
                                                            <button @click="editMoveItem(idx, -1)" :disabled="idx === 0"
                                                                    :class="idx === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:text-white'"
                                                                    class="text-gray-600 text-xs px-1 rounded hover:bg-gray-700">↑</button>
                                                            <button @click="editMoveItem(idx, 1)" :disabled="idx === flowData.flow.length - 1"
                                                                    :class="idx === flowData.flow.length - 1 ? 'opacity-30 cursor-not-allowed' : 'hover:text-white'"
                                                                    class="text-gray-600 text-xs px-1 rounded hover:bg-gray-700">↓</button>
                                                            <button @click="editDeleteItem(idx)"
                                                                    class="text-gray-700 hover:text-red-400 text-xs px-1 rounded hover:bg-gray-800 transition" title="Usuń">✕</button>
                                                        </div>
                                                    </template>

                                                    <!-- Status + actions -->
                                                    <div class="flex-shrink-0 flex items-center gap-2 ml-2">
                                                        <template x-if="fileItemIsGreen(idx)">
                                                            <div class="flex items-center gap-1">
                                                                <span class="text-xs text-green-500" x-text="fileItemSizeMb(idx)"></span>
                                                                <button @click="openVideoModal(fileItemName(idx))"
                                                                        class="text-green-500 hover:text-green-400 text-sm px-1 py-0.5 rounded"
                                                                        title="Odtwórz film">▶</button>
                                                                <button @click="regenFile(fileItemName(idx))"
                                                                        :disabled="isRunning"
                                                                        :class="isRunning ? 'opacity-30 cursor-not-allowed text-gray-600' : 'text-gray-500 hover:text-blue-400'"
                                                                        class="text-sm px-1 py-0.5 rounded transition"
                                                                        title="Re-generuj (zarchiwizuj i uruchom ponownie)">↺</button>
                                                                <button @click="archiveFile(fileItemName(idx))"
                                                                        class="text-gray-600 hover:text-red-400 text-sm px-1 py-0.5 rounded"
                                                                        title="Archiwizuj bez re-generowania">🗑</button>
                                                                <template x-if="fileItemHasArchived(idx)">
                                                                    <button @click="openVersionsModal(fileItemName(idx))"
                                                                            class="text-gray-500 hover:text-yellow-400 text-sm px-1 py-0.5 rounded transition"
                                                                            title="Pokaż wersje archiwalne">📂</button>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        <template x-if="fileItemIsRed(idx)">
                                                            <div class="flex items-center gap-1">
                                                                <span class="text-red-500 text-xs">○ brak</span>
                                                                <button @click="_startOnly([fileItemName(idx)])"
                                                                        :disabled="isRunning"
                                                                        :class="isRunning ? 'opacity-30 cursor-not-allowed text-gray-600' : 'text-red-600 hover:text-red-400'"
                                                                        class="text-sm px-1 py-0.5 rounded transition"
                                                                        title="Generuj tylko tę tranzycję">↺</button>
                                                                <template x-if="fileItemHasVersions(idx)">
                                                                    <button @click="openVersionsModal(fileItemName(idx))"
                                                                            class="text-gray-500 hover:text-yellow-400 text-sm px-1 py-0.5 rounded transition"
                                                                            title="Pokaż wersje archiwalne">📂</button>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        <template x-if="fileItemIsGray(idx)">
                                                            <div class="flex items-center gap-1">
                                                                <template x-if="/\.(mp4|mov|avi|mkv|webm)$/i.test(item.file || '')">
                                                                    <span class="text-xs text-blue-600" x-text="fileItemSourceSizeMb(idx)"></span>
                                                                </template>
                                                                <template x-if="!/\.(mp4|mov|avi|mkv|webm)$/i.test(item.file || '')">
                                                                    <span class="text-gray-600 text-xs" title="Ten plik nie generuje przejścia">—</span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        <!-- Source video play — only for mp4/video source files -->
                                                        <template x-if="/\.(mp4|mov|avi|mkv|webm)$/i.test(item.file || '')">
                                                            <button @click.stop="openSourceVideoModal(item.file)"
                                                                    class="text-blue-500 hover:text-blue-300 text-sm px-1 py-0.5 rounded transition"
                                                                    title="Odtwórz plik źródłowy">▶</button>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>

                                        <!-- Add-zone after each item — INSIDE x-for root div -->
                                        <div :class="editMode ? 'add-zone active' : 'add-zone'"
                                             @click="openAddItemModal(idx)"
                                             class="w-full items-center justify-center gap-2 py-1 mt-1 text-xs font-medium text-blue-400 bg-blue-950/40 border border-dashed border-blue-800 rounded hover:bg-blue-900/50 hover:border-blue-500 hover:text-blue-300 transition cursor-pointer">
                                            <span>+</span><span>wstaw element</span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
            </template>

            <!-- ═══ PRE-PROCESSING VIEW ═══ -->
            <template x-if="selectedRun && (selectedRun.compatibility === 'current' || selectedRun.compatibility === 'yaml') && !selectedRun.syntax_error && preMode">
                <div class="flex flex-col h-full overflow-hidden">

                    <!-- ── Header: target resolution + controls ── -->
                    <div class="flex items-center gap-3 px-5 py-2.5 border-b border-gray-700 bg-gray-900 flex-shrink-0 text-xs flex-wrap">
                        <span class="text-gray-400 flex-shrink-0">Docelowa rozdzielczość:</span>
                        <input x-model.number="preTargetW" type="number" min="64" max="8192" step="64"
                               class="w-20 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-gray-200 text-center focus:outline-none focus:border-purple-500">
                        <span class="text-gray-600">×</span>
                        <input x-model.number="preTargetH" type="number" min="64" max="8192" step="64"
                               class="w-20 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-gray-200 text-center focus:outline-none focus:border-purple-500">
                        <span class="text-gray-600"
                              x-show="selectedRun?.force_resolution"
                              x-text="`(projekt: ${selectedRun?.force_resolution?.[0]}×${selectedRun?.force_resolution?.[1]})`"></span>
                        <div class="flex-1"></div>
                        <button @click="preSelectBelowTarget()" :disabled="preIsRunning"
                                class="text-gray-400 hover:text-white border border-gray-600 hover:border-gray-400 px-2 py-1 rounded transition disabled:opacity-40">
                            ☑ Zaznacz poniżej celu</button>
                        <button @click="preSelected = {}" :disabled="preIsRunning"
                                class="text-gray-400 hover:text-white border border-gray-600 hover:border-gray-400 px-2 py-1 rounded transition disabled:opacity-40">
                            ☐ Odznacz</button>
                        <button @click="loadPreClips()" :disabled="preIsRunning"
                                class="text-gray-400 hover:text-white border border-gray-600 hover:border-gray-400 px-2 py-1 rounded transition disabled:opacity-40">
                            🔍 Odśwież</button>
                    </div>

                    <!-- ── File list ── -->
                    <div class="flex-1 overflow-y-auto">
                        <template x-if="preLoading">
                            <div class="flex items-center gap-2 p-5 text-gray-600 text-sm">
                                <span class="animate-spin inline-block">⟳</span> Skanowanie plików…
                            </div>
                        </template>
                        <template x-if="!preLoading && preClips.length === 0">
                            <div class="p-5 text-gray-700 text-sm">Brak klipów wideo. Sprawdź czy projekt ma pliki mp4.</div>
                        </template>
                        <template x-if="!preLoading && preClips.length > 0">
                            <div>
                                <template x-for="clip in preClips" :key="clip.seq">
                                    <div class="flex items-center gap-3 px-5 py-2 border-b border-gray-800/60 text-xs transition"
                                         :class="clip.status !== 'ok' ? 'opacity-35 cursor-default' : 'hover:bg-gray-800/40'">

                                        <!-- Checkbox (only for existing files) -->
                                        <div class="w-4 flex-shrink-0 flex items-center justify-center">
                                            <template x-if="clip.status === 'ok'">
                                                <input type="checkbox"
                                                       :checked="!!preSelected[clip.name]"
                                                       @change="preToggle(clip.name)"
                                                       :disabled="preIsRunning"
                                                       class="rounded border-gray-600 bg-gray-800 cursor-pointer accent-purple-500">
                                            </template>
                                        </div>

                                        <!-- Type icon -->
                                        <span class="flex-shrink-0"
                                              x-text="clip.type==='external' ? '📂' : clip.subtype==='chain' ? '⛓' : '🔀'"></span>

                                        <!-- Name -->
                                        <span class="flex-1 min-w-0 truncate"
                                              :class="clip.status === 'ok' ? 'text-gray-300' : 'text-gray-600'"
                                              x-text="clip.name"></span>

                                        <!-- Resolution / status -->
                                        <div class="flex items-center gap-2 flex-shrink-0 font-mono">
                                            <template x-if="clip.status !== 'ok'">
                                                <span class="text-gray-600 italic font-sans">nie wygenerowany</span>
                                            </template>
                                            <template x-if="clip.status === 'ok' && clip.width === null">
                                                <span class="text-yellow-600">⚠ brak metadanych</span>
                                            </template>
                                            <template x-if="clip.status === 'ok' && clip.width !== null">
                                                <span :class="preBelowTarget(clip) ? 'text-orange-400' : 'text-green-600'"
                                                      x-text="`${clip.width}×${clip.height}`"></span>
                                            </template>
                                            <template x-if="clip.status === 'ok' && clip.width !== null && preBelowTarget(clip)">
                                                <span class="text-gray-700">→</span>
                                                <span class="text-gray-500" x-text="`${preTargetW}×${preTargetH}`"></span>
                                            </template>
                                            <template x-if="clip.status === 'ok' && clip.width !== null && !preBelowTarget(clip) && !preQueueStatus[clip.name]">
                                                <span class="text-green-800">✅</span>
                                            </template>
                                        </div>

                                        <!-- Queue status badge (during/after batch) -->
                                        <template x-if="preQueueStatus[clip.name]">
                                            <span class="flex-shrink-0 w-5 text-center"
                                                  :class="preQueueStatus[clip.name]==='running' ? 'animate-spin inline-block' : ''"
                                                  x-text="preQueueStatus[clip.name]==='done' ? '✅' : preQueueStatus[clip.name]==='running' ? '⟳' : preQueueStatus[clip.name]==='error' ? '❌' : '⏳'">
                                            </span>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- ── Action bar ── -->
                    <div class="flex items-center gap-3 px-5 py-2.5 border-t border-gray-700 bg-gray-900 flex-shrink-0 text-xs">
                        <span class="text-gray-600"
                              x-text="`Zaznaczono: ${preSelectedCount()} z ${preClips.filter(c=>c.status==='ok').length} dostępnych`"></span>
                        <div class="flex-1"></div>
                        <button @click="preStartBatch()"
                                :disabled="preSelectedCount() === 0 || preIsRunning"
                                :class="preSelectedCount() === 0 || preIsRunning
                                    ? 'opacity-40 cursor-not-allowed bg-purple-900'
                                    : 'bg-purple-700 hover:bg-purple-600 cursor-pointer'"
                                class="flex items-center gap-2 px-4 py-1.5 text-white rounded-lg transition">
                            <span x-show="preIsRunning" class="animate-spin inline-block">⟳</span>
                            <span x-text="preIsRunning
                                ? `W toku… (${preQueue.filter(i=>i.status==='done').length}/${preQueue.length})`
                                : `⬆ Upscaluj zaznaczone (${preSelectedCount()})`"></span>
                        </button>
                    </div>

                    <!-- ── Queue progress panel ── -->
                    <template x-if="preQueue.length > 0">
                        <div class="border-t-2 border-purple-900 bg-gray-950 flex-shrink-0 overflow-y-auto" style="max-height:160px">
                            <div class="px-5 py-1.5 text-xs text-purple-400 font-semibold border-b border-gray-800 sticky top-0 bg-gray-950 flex items-center gap-2">
                                <span>Kolejka upscalingu</span>
                                <span class="text-gray-600"
                                      x-text="`${preQueue.filter(i=>i.status==='done').length} / ${preQueue.length} gotowych`"></span>
                                <template x-if="!preIsRunning && preQueue.length > 0">
                                    <button @click="preQueue = []; preQueueStatus = {}"
                                            class="ml-auto text-gray-600 hover:text-gray-400 transition">✕ Wyczyść</button>
                                </template>
                            </div>
                            <template x-for="(item, idx) in preQueue" :key="idx">
                                <div class="flex items-center gap-3 px-5 py-1.5 border-b border-gray-900/60 text-xs">
                                    <span :class="item.status==='running' ? 'animate-spin inline-block' : ''"
                                          x-text="item.status==='done' ? '✅' : item.status==='running' ? '⟳' : item.status==='error' ? '❌' : '⏳'"></span>
                                    <span class="flex-1 min-w-0 truncate text-gray-400" x-text="item.clip.name"></span>
                                    <span x-show="item.elapsed_s && item.status !== 'pending'"
                                          class="text-gray-600 font-mono flex-shrink-0"
                                          x-text="`${item.elapsed_s}s`"></span>
                                    <span x-show="item.status === 'error'"
                                          class="text-red-500 truncate max-w-xs flex-shrink-0" x-text="item.error"></span>
                                </div>
                            </template>
                        </div>
                    </template>

                </div>
            </template>

            <!-- ═══ POST-PROCESSING VIEW ═══ -->
            <template x-if="selectedRun && (selectedRun.compatibility === 'current' || selectedRun.compatibility === 'yaml') && !selectedRun.syntax_error && postMode">
                <div class="flex flex-col h-full overflow-hidden">

                    <!-- ── TOP: Player + Inspector ── -->
                    <div class="flex flex-shrink-0 border-b border-gray-700" style="height:460px">

                        <!-- PLAYER -->
                        <div class="flex-1 min-w-0 bg-black flex flex-col">
                            <video x-ref="postPlayer"
                                   class="flex-1 w-full min-h-0 object-contain"
                                   @ended="postPlayNext()"
                                   @timeupdate="postUpdateProgress()"
                                   @play="postIsPlaying=true"
                                   @pause="postIsPlaying=false">
                            </video>
                            <!-- Controls bar -->
                            <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-900 text-xs text-gray-300 flex-shrink-0 border-t border-gray-800">
                                <button @click="postPlayPrev()" class="text-gray-400 hover:text-white transition px-1" title="Poprzedni">◄</button>
                                <button @click="postTogglePlay()"
                                        class="w-6 h-6 flex items-center justify-center rounded bg-gray-700 hover:bg-gray-600 transition text-xs"
                                        :title="postIsPlaying ? 'Pauza' : 'Odtwórz'">
                                    <span x-text="postIsPlaying ? '‖' : '▶'"></span>
                                </button>
                                <button @click="postPlayNext()" class="text-gray-400 hover:text-white transition px-1" title="Następny">►</button>
                                <!-- Progress bar -->
                                <div class="flex-1 bg-gray-700 h-1.5 rounded mx-1 cursor-pointer relative"
                                     @click="postSeek($event)">
                                    <div class="bg-blue-500 h-1.5 rounded absolute left-0 top-0 transition-all"
                                         :style="`width:${postProgress}%`"></div>
                                </div>
                                <span class="text-gray-500 truncate max-w-[140px]" x-text="postCurrentClipName()"></span>
                                <span x-show="postCurrentIndex >= 0" class="text-gray-500 flex-shrink-0 font-mono"
                                      x-text="postTimeDisplay()"></span>
                                <span x-show="postCurrentIndex >= 0" class="text-gray-700 flex-shrink-0"
                                      x-text="`(${postCurrentIndex+1}/${postClips.length})`"></span>
                            </div>
                        </div>

                        <!-- INSPECTOR -->
                        <div class="w-64 flex-shrink-0 border-l border-gray-700 bg-gray-800 flex flex-col text-xs overflow-y-auto">
                            <template x-if="postSelectedClip()">
                                <div class="flex flex-col h-full">
                                    <!-- Thumbnail -->
                                    <div class="relative bg-gray-900 flex-shrink-0" style="height:80px">
                                        <img :src="postClipThumbUrl(postSelectedClip())"
                                             class="w-full h-full object-cover"
                                             onerror="this.style.display='none'">
                                    </div>
                                    <!-- Info -->
                                    <div class="p-3 flex flex-col gap-2 flex-1">
                                        <p class="text-gray-200 font-medium break-all leading-tight" x-text="postSelectedClip().name"></p>
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <span :class="postSelectedClip().status==='ok' ? 'text-green-400' : 'text-red-400'"
                                                  x-text="postSelectedClip().status==='ok' ? '✅ Gotowy' : '❌ Brakujący'"></span>
                                            <span x-show="postSelectedClip().size_mb" class="text-gray-600"
                                                  x-text="postSelectedClip().size_mb + ' MB'"></span>
                                        </div>
                                        <div class="flex flex-wrap gap-x-3 gap-y-0.5 text-gray-600">
                                            <span x-show="postSelectedClip().width && postSelectedClip().height"
                                                  x-text="postSelectedClip().width + '×' + postSelectedClip().height"></span>
                                            <span x-show="postSelectedClip().duration_s"
                                                  x-text="'⏱ ' + postFmtTime(postSelectedClip().duration_s)"></span>
                                            <span x-text="postSelectedClip().type==='external' ? '📂 Zewnętrzny' : (postSelectedClip().subtype==='chain' ? '⛓️ Chain' : '🔀 Tranzycja')"></span>
                                        </div>
                                        <!-- Actions -->
                                        <div class="flex flex-col gap-1.5 mt-auto pt-2">
                                            <button @click="postPlayFrom(postSelectedIndex)"
                                                    class="bg-blue-900 hover:bg-blue-800 text-blue-200 px-3 py-1.5 rounded transition text-center">
                                                ▶ Odtwórz od tego
                                            </button>
                                            <template x-if="postSelectedClip().status==='ok'">
                                                <button @click="postArchiveClip(postSelectedClip())"
                                                        class="text-gray-400 hover:text-white border border-gray-600 hover:border-gray-400 px-3 py-1.5 rounded transition text-center">
                                                    📦 Archiwizuj
                                                </button>
                                            </template>
                                            <template x-if="postSelectedClip().type==='generated' && postSelectedClip().status==='ok'">
                                                <button @click="postTrashClip(postSelectedClip())"
                                                        class="text-red-500 hover:text-red-300 border border-red-900 hover:border-red-700 px-3 py-1.5 rounded transition text-center">
                                                    🗑 Przesuń do kosza
                                                </button>
                                            </template>
                                            <template x-if="postSelectedClip().status==='ok'">
                                                <button @click="openUpscaleModal(postSelectedClip())"
                                                        class="text-yellow-400 hover:text-yellow-200 border border-yellow-800 hover:border-yellow-600 px-3 py-1.5 rounded transition text-center">
                                                    ⬆ Upscaluj
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template x-if="!postSelectedClip()">
                                <div class="flex items-center justify-center h-full text-gray-700 select-none text-center px-4">
                                    kliknij klip<br>w filmstrip
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- ── FILMSTRIP (poziomy scroll) ── -->
                    <div x-ref="postFilmstrip"
                         class="flex-1 min-h-0 overflow-x-auto overflow-y-hidden bg-gray-950 flex items-center px-3 gap-2"
                         style="min-height:110px; max-height:110px">
                        <template x-if="postLoading">
                            <div class="flex items-center gap-2 text-gray-600 text-sm flex-shrink-0">
                                <span class="animate-spin inline-block">⟳</span> Ładowanie…
                            </div>
                        </template>
                        <template x-if="!postLoading && postClips.length === 0">
                            <div class="text-gray-700 text-xs flex-shrink-0">Brak klipów. Sprawdź czy pliki zostały wygenerowane.</div>
                        </template>
                        <template x-for="(clip, i) in postClips" :key="clip.seq">
                            <div @click="postSelectClip(i)"
                                 @dblclick="postPlayFrom(i)"
                                 :data-clip-idx="i"
                                 class="flex-shrink-0 cursor-pointer rounded overflow-hidden border-2 transition select-none"
                                 :class="postTileClass(i)"
                                 style="width:120px"
                                 :title="clip.name">
                                <!-- Thumbnail -->
                                <div class="relative bg-gray-800" style="height:68px">
                                    <img :src="postClipThumbUrl(clip)"
